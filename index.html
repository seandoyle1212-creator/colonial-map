<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✏️ SWAP: the title shown in the browser tab -->
  <title>Colonial Territories Map</title>

  <!-- Leaflet: free, open-source map library. No account or API key needed. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    /* ------------------------------------------------------------
       COLOURS — change these to restyle the whole page.
       ------------------------------------------------------------ */
    :root {
      --card-bg: rgba(255, 252, 245, 0.95);  /* text box background (0.95 = almost solid) */
      --card-text: #1f1b16;                  /* text colour inside the boxes */
      --card-muted: #6b6257;                 /* small grey notes */
      --accent: #a23b2a;                     /* headings, highlighted territory */
      --context-line: #8a7f72;               /* thin lines for all other historical borders */
      --page-bg: #e9e4da;                    /* shows briefly while map tiles load */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --card-bg: rgba(28, 25, 22, 0.94);
        --card-text: #f1ece4;
        --card-muted: #b3a999;
        --accent: #e0826f;
        --context-line: #9c9184;
        --page-bg: #1c1916;
      }
    }

    html, body { margin: 0; padding: 0; background: var(--page-bg); }
    body { font-family: Georgia, "Times New Roman", serif; color: var(--card-text); }

    /* The map stays fixed in the background while the text scrolls over it. */
    #map { position: fixed; inset: 0; z-index: 0; }

    /* Fade the modern basemap so the historical outlines stand out
       and modern labels are less prominent. 0 = invisible, 1 = full strength. */
    .basemap { filter: grayscale(1) sepia(0.25); opacity: 0.55; }

    /* "Open full screen" bar — only appears when the page is embedded in Google Sites. */
    #topbar {
      position: fixed; top: 10px; right: 10px; z-index: 1000; display: none;
      font: 14px/1.2 system-ui, sans-serif;
    }
    #topbar a {
      display: inline-block; padding: 8px 12px; border-radius: 6px;
      background: var(--card-bg); color: var(--card-text); text-decoration: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    /* The column of text "stops" that scroll past the map. */
    #story { position: relative; z-index: 1; pointer-events: none; }
    .step {
      min-height: 100vh;              /* each stop takes one screen of scrolling */
      display: flex; align-items: center;
      padding: 0 16px; box-sizing: border-box;
    }
    .card {
      pointer-events: auto;
      width: 100%; max-width: 380px;
      margin-left: 3vw;
      background: var(--card-bg);
      padding: 20px 22px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      line-height: 1.55; font-size: 17px;
      opacity: 0.35; transition: opacity .4s;
    }
    .step.is-active .card { opacity: 1; }
    .card h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); line-height: 1.25; }
    .card .dates { margin: 0 0 12px; font: 600 13px/1.3 system-ui, sans-serif;
                   letter-spacing: .04em; text-transform: uppercase; color: var(--card-muted); }
    .card p { margin: 0 0 10px; }
    .card .note { font: 13px/1.45 system-ui, sans-serif; color: var(--card-muted);
                  border-top: 1px solid rgba(128,128,128,.3); padding-top: 8px; margin-top: 12px; }
    .spacer { height: 40vh; }

    /* Permanent text labels placed on the map (used for the Haiti stop). */
    .map-label {
      background: var(--card-bg); color: var(--card-text); border: 1px solid var(--accent);
      font: 600 13px/1.2 system-ui, sans-serif; box-shadow: none;
    }

    /* PHONES: text boxes sit along the bottom so the map is visible above them. */
    @media (max-width: 700px) {
      .step { align-items: flex-end; padding-bottom: 6vh; }
      .card { margin: 0 auto; max-width: none; font-size: 16px; padding: 16px 18px; }
    }

    /* Respect visitors who turn off animations in their device settings. */
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>

  <div id="map" role="img" aria-label="Map that changes as you scroll through the story"></div>
  <div id="topbar"><a id="fullscreen-link" href="#" target="_blank" rel="noopener">Open full screen ↗</a></div>
  <main id="story"></main>

<script>
/* =====================================================================
   ✏️  YOUR CONTENT GOES HERE — this is the only part you need to edit.
   =====================================================================

   Each stop is one block between { and }, separated by commas.
   The stops appear in the order you list them. To reorder, cut and
   paste whole blocks. To add one, copy a block and change its values.

   FIELDS
   ------
   title      Heading shown in the text box.
   dates      Small line under the heading (optional; use "" to hide).
   text       The paragraphs. Wrap each paragraph in <p> ... </p>.
   lat, lng   The point the map centres on. Find these by right-clicking
              a place in Google Maps: the first number is lat, second lng.
   zoom       How close to zoom: 2 = whole world, 4 = a large region,
              6 = one country, 8 = a city area.

   OPTIONAL HISTORICAL OUTLINES (see the notes at the bottom of this file)
   year       Draw historical borders from this year's map. Available
              years include 1492, 1530, 1600, 1650, 1700, 1715, 1783,
              1800, 1815, 1880, 1900, 1914, 1920, 1938, 1945, 1960, 1994.
              Leave it out to show no historical borders.
   highlight  Names of territories (as spelled in that year's file) to
              colour in. e.g. ["British East Africa"]
   ruler      Colour every territory controlled by these powers, as
              spelled in that year's file. e.g. ["France"]
   label      A text label pinned to the map, for places the dataset is
              missing or gets wrong: { lat: 0, lng: 0, text: "..." }
   note       Small grey note at the bottom of the box (sources, caveats).
   ===================================================================== */

const STOPS = [
  {
    title: "Empires in 1914",
    dates: "On the eve of the First World War",
    text: `<p>By 1914, Britain and France between them claimed authority over large parts of Africa, South and Southeast Asia, and the Caribbean.</p>
           <p>The shaded areas show territory those two powers controlled or claimed. Scroll down to look closer at three places.</p>`,
    lat: 12, lng: 20, zoom: 2,
    year: 1914,
    ruler: ["United Kingdom of Great Britain and Ireland", "United Kingdom", "France"],
    note: "Borders from a 1914 historical dataset; many are approximate and reflect colonial claims, not control on the ground."
  },
  {
    title: "British East Africa",
    dates: "Protectorate 1895 · Kenya Colony 1920",
    text: `<p>Britain declared the East Africa Protectorate in 1895. In 1920 most of it became the Colony of Kenya.</p>
           <p>The colonial state reserved large areas of the central highlands for European settlers, a land question that shaped politics long after independence in 1963.</p>`,
    lat: 0.5, lng: 38, zoom: 5,
    year: 1914,
    highlight: ["British East Africa"],
    note: "The 1914 outline includes Jubaland, which Britain transferred to Italy in 1925 — one reason it does not match modern Kenya."
  },
  {
    title: "French West Africa",
    dates: "Federation 1895–1958",
    text: `<p>France grouped its West African colonies into a single federation, Afrique occidentale française, governed from Dakar after 1902.</p>
           <p>Today the same area spans eight independent states, including Senegal, Mali, Guinea and Côte d'Ivoire.</p>`,
    lat: 14, lng: -5, zoom: 4,
    year: 1914,
    highlight: ["French West Africa"],
    note: "The federation's internal colony borders changed several times; the outline shows only the outer edge."
  },
  {
    title: "Saint-Domingue → Haiti",
    dates: "French colony to 1804",
    text: `<p>The French colony of Saint-Domingue, on the western part of Hispaniola, was one of the most profitable slave plantation economies in the Atlantic world.</p>
           <p>The revolution that began in 1791 led to independence as Haiti in 1804. In 1825 France demanded a large indemnity as the price of recognition.</p>`,
    lat: 19, lng: -72.6, zoom: 7,
    year: 1783,
    label: { lat: 19.1, lng: -72.4, text: "Saint-Domingue (French)" },
    note: "The 1783 dataset has no outline for Saint-Domingue, so a label marks it instead. Always check what a dataset actually contains."
  }
];
/* ======================= end of your content ======================= */


/* ---------------------------------------------------------------------
   BASEMAP (the background map). Pick ONE by leaving it un-commented.
   Both are free and need no key. Keep the attribution text — it's required.
   --------------------------------------------------------------------- */

// Option A (default): OpenStreetMap. Fine for a small educational site.
// Shows modern borders and place names, which is why it's faded above.
const BASEMAP_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const BASEMAP_OPTIONS = {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
};

// Option B: Esri World Physical — terrain only, no modern borders or labels,
// which suits historical maps. Only goes to zoom 8. Check Esri's terms of use
// before relying on it. To use it, delete the "//" from the next 5 lines and
// put "//" in front of the 5 Option A lines above.
// const BASEMAP_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}";
// const BASEMAP_OPTIONS = {
//   maxZoom: 8,
//   attribution: 'Tiles &copy; Esri &mdash; Source: US National Park Service'
// };

// Where the historical borders come from (free, open dataset).
const HISTORY_URL = "https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_{year}.geojson";
const HISTORY_CREDIT = 'Historical borders: <a href="https://github.com/aourednik/historical-basemaps">historical-basemaps</a> (Ourednik)';


/* =====================================================================
   You shouldn't need to change anything below this line.
   ===================================================================== */

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const isPhone = () => window.innerWidth <= 700;
const style = getComputedStyle(document.documentElement);
const cssVar = (name) => style.getPropertyValue(name).trim();

// Show the "Open full screen" link only when embedded inside another page.
if (window.self !== window.top) {
  document.getElementById("topbar").style.display = "block";
  document.getElementById("fullscreen-link").href = window.location.href;
}

// --- Build the map ---
const map = L.map("map", {
  zoomControl: false,
  scrollWheelZoom: false,   // scrolling moves the story, not the map
  dragging: !L.Browser.mobile, // on phones, swipes scroll the story
  touchZoom: false,
  doubleClickZoom: false,
  boxZoom: false,
  keyboard: false,
  preferCanvas: true,
  worldCopyJump: true
});
L.tileLayer(BASEMAP_URL, Object.assign({ className: "basemap" }, BASEMAP_OPTIONS)).addTo(map);
if (STOPS.some(s => s.year)) map.attributionControl.addAttribution(HISTORY_CREDIT);

// --- Build the text boxes from the STOPS list ---
const story = document.getElementById("story");
story.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');
STOPS.forEach((stop, i) => {
  const step = document.createElement("section");
  step.className = "step";
  step.dataset.index = i;
  step.innerHTML = `
    <div class="card">
      <h2>${stop.title}</h2>
      ${stop.dates ? `<p class="dates">${stop.dates}</p>` : ""}
      ${stop.text}
      ${stop.note ? `<p class="note">${stop.note}</p>` : ""}
    </div>`;
  story.appendChild(step);
});
story.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');

// --- Historical borders: load each year's file once, then reuse it ---
const yearCache = {};
function loadYear(year) {
  if (!yearCache[year]) {
    yearCache[year] = fetch(HISTORY_URL.replace("{year}", year))
      .then(r => { if (!r.ok) throw new Error("No file for " + year); return r.json(); })
      .catch(err => { console.warn(err); return null; });
  }
  return yearCache[year];
}

let overlay = null;      // the borders currently drawn
let labelLayer = null;   // the pinned label currently drawn
let activeIndex = -1;

function drawOverlay(stop, index) {
  if (overlay) { map.removeLayer(overlay); overlay = null; }
  if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }

  if (stop.label) {
    labelLayer = L.tooltip({ permanent: true, direction: "center", className: "map-label" })
      .setLatLng([stop.label.lat, stop.label.lng])
      .setContent(stop.label.text)
      .addTo(map);
  }
  if (!stop.year) return;

  const names = stop.highlight || [];
  const rulers = stop.ruler || [];
  loadYear(stop.year).then(data => {
    if (!data || index !== activeIndex) return; // visitor already scrolled on
    overlay = L.geoJSON(data, {
      style: f => {
        const p = f.properties || {};
        const on = names.includes(p.NAME) || rulers.includes(p.SUBJECTO);
        return on
          ? { color: cssVar("--accent"), weight: 2, fillColor: cssVar("--accent"), fillOpacity: 0.35 }
          : { color: cssVar("--context-line"), weight: 0.6, fillOpacity: 0 };
      }
    }).addTo(map);
  });
}

// Move the map so the target sits in the open area beside (or above) the text box.
function goTo(stop) {
  const target = L.latLng(stop.lat, stop.lng);
  const z = stop.zoom;
  const card = document.querySelector(`.step[data-index="${STOPS.indexOf(stop)}"] .card`);
  let shift = L.point(0, 0);
  if (card) {
    const r = card.getBoundingClientRect();
    shift = isPhone() ? L.point(0, r.height / 2) : L.point(-(r.right) / 2, 0);
  }
  const center = map.unproject(map.project(target, z).add(shift), z);
  if (reduceMotion) map.setView(center, z, { animate: false });
  else map.flyTo(center, z, { duration: 1.6 });
}

function activate(index) {
  if (index === activeIndex) return;
  activeIndex = index;
  document.querySelectorAll(".step").forEach(el =>
    el.classList.toggle("is-active", Number(el.dataset.index) === index));
  goTo(STOPS[index]);
  drawOverlay(STOPS[index], index);
}

// Start on the first stop, then switch whenever a box crosses the middle of the screen.
map.setView([STOPS[0].lat, STOPS[0].lng], STOPS[0].zoom);
activate(0);
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) activate(Number(e.target.dataset.index)); });
}, { rootMargin: "-45% 0px -45% 0px" });
document.querySelectorAll(".step").forEach(el => observer.observe(el));

/* ---------------------------------------------------------------------
   NOTES ON HISTORICAL OUTLINES
   - Names must match the dataset exactly (capitals and spaces too).
     To see the names for a year, open this link in a browser and use
     Find (Ctrl/Cmd+F), replacing 1914 with your year:
     https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_1914.geojson
     Look for "NAME":"..." (the territory) and "SUBJECTO":"..." (who ruled it).
   - The dataset is a volunteer project. Its own documentation says to
     check it against other sources before academic use. Many borders
     are marked low-precision. Say so in your notes.
   - If a name doesn't match, nothing is coloured — the page won't break.
   --------------------------------------------------------------------- */
</script>
</body>
</html>
