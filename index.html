<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire and After: A Scrolling Atlas of Colonialism</title>
<meta name="description" content="A scroll-driven map of colonialism from antiquity to the present, with emphasis on the British and French empires, decolonisation and colonial legacies in development.">

<!-- Leaflet (free, open source, no API key). A second CDN is tried automatically if the first fails. -->
<link id="leaflet-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;600;700&display=swap">

<style>
:root{
  --ink:#1f1c18; --muted:#6a6157; --paper:#fbf8f1; --card:rgba(251,248,241,.97);
  --sea:#d9e2e1; --land:#efe8d7; --border:#c3b79f; --rule:rgba(31,28,24,.14);
  --accent:#8c2f23; --gb:#b23a2e; --fr:#2f5f9e; --both:#7b4f97; --oth:#958b78;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --cardw:430px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--sea);color:var(--ink)}
body{font-family:var(--serif);font-size:17px;line-height:1.58;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
#map{position:fixed;inset:0;z-index:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--sans)}
.leaflet-control-attribution{font:11px/1.3 var(--sans);background:rgba(251,248,241,.85)!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:8px 14px;background:linear-gradient(rgba(251,248,241,.96),rgba(251,248,241,.88));
  border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:14px}
#topbar .brand{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap}
#chapters{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:6px}
#chapters::-webkit-scrollbar{display:none}
#chapters button,.tb{font:600 13px/1 var(--sans);border:1px solid var(--rule);background:transparent;color:var(--ink);
  padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
#chapters button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#topbar .spacer{flex:1}
.tb:hover,#chapters button:hover{border-color:var(--ink)}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:31;width:0}

/* ---------- year + legend ---------- */
#hud{position:fixed;right:14px;top:58px;z-index:20;font-family:var(--sans);text-align:right;pointer-events:none}
#year{font:700 36px/1 var(--serif);letter-spacing:-.01em;color:var(--ink);text-shadow:0 0 12px var(--paper),0 0 4px var(--paper)}
#yearnote{font-size:12px;color:var(--muted);margin-top:2px;text-shadow:0 0 6px var(--paper)}
#legend{margin-top:6px;display:inline-block;text-align:left;background:#fbf8f1;border:1px solid rgba(31,28,24,.3);
  border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.25;max-width:200px;pointer-events:auto;
  box-shadow:0 2px 8px rgba(31,28,24,.18)}
#legend:empty{display:none}
#legend .row{display:flex;align-items:center;gap:6px;margin:1px 0}
#legend .sw{width:16px;height:10px;flex:0 0 16px}
#legend .dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);margin:0 3px}
#legend .hd{font-weight:700;margin:4px 0 2px;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em}
#legend details summary{cursor:pointer;color:var(--muted);font-size:10.5px;margin-top:3px}

/* ---------- story ---------- */
#story{position:relative;z-index:10;pointer-events:none}
html{scroll-snap-type:y proximity}
.step{min-height:100vh;display:flex;align-items:center;padding:62px 0 16px;scroll-snap-align:center}
.card{pointer-events:auto;width:var(--cardw);max-width:calc(100vw - 28px);margin-left:max(16px,3vw);
  max-height:calc(100vh - 84px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px 16px;
  box-shadow:0 6px 24px rgba(31,28,24,.16);opacity:.45;transform:translateY(8px);transition:opacity .45s,transform .45s}
.step.is-active .card{opacity:1;transform:none}
.kicker{font:700 11.5px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 6px}
.card h2{font-size:23px;line-height:1.22;margin:0 0 4px;font-weight:700}
.card h1{font-size:31px;line-height:1.14;margin:0 0 8px}
.dates{font:600 13px/1.3 var(--sans);color:var(--muted);margin:0 0 12px;letter-spacing:.02em}
.card p{margin:0 0 11px}
.note{font:13.5px/1.45 var(--sans);color:var(--muted);border-top:1px solid var(--rule);padding-top:9px;margin-top:12px}
.note b{color:var(--ink)}
.flag{display:inline-block;font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  background:#f1dfc6;color:#7a4a12;border-radius:4px;padding:3px 5px;margin-right:4px;vertical-align:1px}
a.cite{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(140,47,35,.35);white-space:nowrap}
a.cite:hover{border-bottom-color:var(--accent)}
.ax{text-decoration:underline dotted rgba(122,74,18,.75);text-underline-offset:3px;cursor:help}
.chapter-tag{display:block;font:700 12px/1.2 var(--sans);color:var(--paper);background:var(--ink);
  margin:-20px -22px 14px;padding:9px 22px;border-radius:10px 10px 0 0;letter-spacing:.04em}
.chapter-tag small{display:block;font-weight:400;opacity:.8;margin-top:2px;letter-spacing:0}
.intro .card{width:min(560px,calc(100vw - 28px))}
.howto{font:14px/1.5 var(--sans);background:#f3ecdf;border-radius:8px;padding:10px 12px;margin:12px 0 4px}
.scrollcue{font:600 13px var(--sans);color:var(--muted);margin-top:12px}
.explorer{font-family:var(--sans);font-size:14px}
.explorer input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--accent)}
.explorer .ctrls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px}
.explorer label{display:flex;gap:5px;align-items:center;cursor:pointer}
.explorer button{font:600 13px var(--sans);padding:6px 12px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.endmatter{pointer-events:auto;position:relative;z-index:10;background:var(--paper);border-top:1px solid var(--rule);padding:48px 20px 80px}
.endmatter .inner{max-width:760px;margin:0 auto}
.endmatter h2{font-size:26px;margin:0 0 10px}
.endmatter h3{font:700 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 0 8px}

/* ---------- panels ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:50;background:var(--paper);
  border-left:1px solid var(--rule);box-shadow:-10px 0 30px rgba(0,0,0,.18);transform:translateX(105%);
  transition:transform .35s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.panel header h2{margin:0;font-size:21px}
.panel header button{font:600 14px var(--sans);border:1px solid var(--rule);background:none;border-radius:6px;padding:6px 10px;cursor:pointer}
.panel .body{overflow-y:auto;padding:6px 20px 40px;font-size:15px;line-height:1.5}
.panel h3{font:700 12px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
ol.refs,ul.refs{list-style:none;padding:0;margin:0}
.refs li{padding:6px 8px 6px 26px;text-indent:-18px;border-radius:6px;margin:0 -8px;transition:background .6s}
.refs li.flash{background:#f6e2b8}
.refs li a{word-break:break-word}
#scrim{position:fixed;inset:0;background:rgba(20,18,15,.25);z-index:45;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}

/* ---------- map labels ---------- */
.lbl{background:rgba(251,248,241,.92);border:1px solid rgba(31,28,24,.25);color:var(--ink);
  font:600 11.5px/1.15 var(--sans);padding:3px 6px;border-radius:4px;box-shadow:none;white-space:nowrap}
.lbl::before{display:none}
.lbl.big{font:700 13px/1.15 var(--serif);font-style:italic;background:transparent;border:none;color:#3d342b;text-shadow:0 0 4px #fff,0 0 8px #fff}
.tip{font:13px/1.35 var(--sans);max-width:300px;white-space:normal}
.tip b{font-size:14px}
#maperr{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:15px var(--sans);
  background:var(--card);padding:14px 18px;border-radius:8px;border:1px solid var(--rule);display:none;max-width:420px;text-align:center}

/* ---------- phones ---------- */
/* shorter screens: tighten type so each tile fits whole */
@media (min-width:761px) and (max-height:860px){ body{font-size:15.5px;line-height:1.5} .card{padding:16px 20px 12px} .card h2{font-size:21px} .card p{margin-bottom:9px} .chapter-tag{margin:-16px -20px 12px;padding:8px 20px} .note{font-size:12.5px} }
@media (min-width:761px) and (max-height:740px){ body{font-size:14.5px;line-height:1.45} .card h2{font-size:19px} .card h1{font-size:26px} :root{--cardw:460px} }
@media (max-width:760px){
  body{font-size:16px}
  #topbar .brand{display:none}
  #hud{top:52px;right:8px}
  #year{font-size:32px}
  #legend{max-width:165px;font-size:10.5px;padding:4px 6px}
  #legend .status{display:none}
  .step{align-items:flex-end;padding:0 0 3vh}
  .card{margin:0 auto;width:calc(100vw - 20px);max-height:52vh;overflow-y:auto;padding:16px 16px 12px}
  .chapter-tag{margin:-16px -16px 12px;padding:8px 16px}
  .card h2{font-size:20px}
  .card h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){ .card,.panel{transition:none} }
@media print{ #map,#topbar,#hud,.panel{display:none} .step{min-height:0} .card{opacity:1;box-shadow:none} }
</style>
</head>
<body>
<div id="progress"></div>
<div id="map" role="img" aria-label="Map of colonial territories that changes as you scroll through the story"></div>
<div id="maperr">The map could not load (no internet connection, or the map libraries were blocked). The text and references still work.</div>

<header id="topbar">
  <span class="brand">Empire and After</span>
  <nav id="chapters" aria-label="Chapters"></nav>
  <span class="spacer"></span>
  <button class="tb" id="btn-method" aria-controls="method">About the map</button>
  <button class="tb" id="btn-refs" aria-controls="refs">References</button>
  <button class="tb" id="btn-full" hidden title="Full screen">⤢</button>
</header>

<div id="hud" aria-live="polite">
  <div id="year"></div>
  <div id="yearnote"></div>
  <div id="legend"></div>
</div>

<main id="story"></main>

<section class="endmatter" id="end">
  <div class="inner">
    <h2>Notes on method</h2>
    <div id="method-inline"></div>
    <p><button class="tb" onclick="openPanel('refs')">Open the full reference list</button></p>
  </div>
</section>

<div id="scrim"></div>
<aside class="panel" id="refs" aria-label="References" aria-hidden="true">
  <header><h2>References</h2><button onclick="closePanels()">Close ✕</button></header>
  <div class="body" id="refs-body"></div>
</aside>
<aside class="panel" id="method" aria-label="About the map" aria-hidden="true">
  <header><h2>About the map</h2><button onclick="closePanels()">Close ✕</button></header>
  <div class="body" id="method-body"></div>
</aside>

<script>
"use strict";
/* =====================================================================
   EMPIRE AND AFTER: a scrolling atlas of colonialism
   ---------------------------------------------------------------------
   Everything is in this one file. To edit the story, change STOPS.
   To edit who ruled where and when, change TERR (and DOTS, CUSTOM).
   Libraries: Leaflet 1.9.4 and topojson-client 3 (MIT/BSD licences).
   Data: Natural Earth via world-atlas 2.0.2 (public domain);
         historical-basemaps by A. Ourednik (GPL-3.0) for 100 CE only.
   ===================================================================== */

const CDN = {
  leaflet: ["https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"],
  topo:    ["https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js","https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"],
  world:   ["https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json","https://unpkg.com/world-atlas@2.0.2/countries-50m.json"],
  ancient: ["https://cdn.jsdelivr.net/gh/aourednik/historical-basemaps@master/geojson/world_100.geojson",
            "https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_100.geojson"]
};

/* ---------- helpers for writing the text ---------- */
const c  = (k,t) => `<a class="cite" href="#r-${k}" data-ref="${k}">${t}</a>`;      // citation link
const ax = (t,tip="Approximate or estimated figure") => `<span class="ax" title="${tip}">${t}</span>`; // approximate
const AP = `<span class="flag">Approx.</span>`;
const SIMP = `<span class="flag">Simplified</span>`;

/* ---------- empires and colours ---------- */
const EMP = {
  GB:{name:"Britain", col:"#b23a2e"}, FR:{name:"France", col:"#2f5f9e"},
  GBFR:{name:"Anglo-French condominium", col:"#7b4f97"},
  SP:{name:"Spain", col:"#c99a2e"}, PT:{name:"Portugal", col:"#3f8a5b"}, NL:{name:"Dutch Republic / Netherlands", col:"#e07a2a"},
  BE:{name:"Belgium", col:"#958b78"}, DE:{name:"Germany", col:"#958b78"}, IT:{name:"Italy", col:"#958b78"}, ZA:{name:"South Africa", col:"#958b78"}
};
const OTHERS = ["SP","PT","NL","BE","DE","IT","ZA"];
const OTH_COL = "#958b78";
const STATUS = {
  h:{label:"Metropole (home state)", fo:.88, w:.8},
  f:{label:"Colony, protectorate or protected state", fo:.62, w:.6},
  o:{label:"Still governed by the same power today", fo:.85, w:1.8},
  d:{label:"Self-governing dominion or settler government", fo:.30, w:.9},
  m:{label:"Mandate, trust territory or condominium", fo:.40, w:1.4, d:"2 3"},
  u:{label:"Union with Britain (colonial status debated)", fo:.40, w:1.3, d:"6 3"},
  p:{label:"Partial control: coastal posts, claims or informal rule", fo:.20, w:1.1, d:"4 3"}
};
const RANK = {h:7,f:6,o:6,m:5,u:5,d:4,p:1};

/* =====================================================================
   WHO RULED WHERE, BY MODERN STATE
   [modern name (Natural Earth spelling), power, [[from, to, status], ...], note, dot]
   'to' is exclusive: [1895,1963] means 1895 up to (not including) 1963.
   All dates are conventional and simplified; see "About the map".
   ===================================================================== */
const NOW = 9999;
const TERR = [
  // ---------- Britain ----------
  ["United Kingdom","GB",[[1500,NOW,"h"]]],
  ["Isle of Man","GB",[[1765,NOW,"h"]],"Crown dependency."],["Jersey","GB",[[1500,NOW,"h"]],"Crown dependency."],["Guernsey","GB",[[1500,NOW,"h"]],"Crown dependency."],
  ["Ireland","GB",[[1541,1922,"u"]],"Kingdom of Ireland under the English (later British) Crown from 1541; united with Great Britain 1801–1922. Northern Ireland remains in the UK."],

  ["Australia","GB",[[1788,1829,"p"],[1829,1856,"f"],[1856,1942,"d"]],"New South Wales 1788; whole continent claimed by 1829; responsible self-government from the 1850s; federation 1901; Statute of Westminster adopted 1942."],
  ["New Zealand","GB",[[1840,1856,"f"],[1856,1947,"d"]],"Treaty of Waitangi 1840; responsible government 1856; Dominion 1907; Statute of Westminster adopted 1947."],

  ["India","GB",[[1757,1818,"p"],[1818,1947,"f"]],"East India Company rule spread from Bengal after 1757; Crown rule from 1858. Roughly two-fifths of the area comprised princely states under indirect rule."],
  ["Pakistan","GB",[[1843,1849,"p"],[1849,1947,"f"]],"Sindh annexed 1843, Punjab 1849."],
  ["Bangladesh","GB",[[1757,1947,"f"]],"Bengal: East India Company control from 1757 (diwani 1765). East Pakistan 1947–71."],
  ["Sri Lanka","GB",[[1796,1815,"p"],[1815,1948,"f"]],"Coastal Ceylon taken from the Dutch 1796; Kandy annexed 1815."],
  ["Myanmar","GB",[[1826,1885,"p"],[1885,1948,"f"]],"Annexed in three wars, 1824–26, 1852 and 1885."],
  ["Malaysia","GB",[[1786,1874,"p"],[1874,1957,"f"]],"Penang 1786; Straits Settlements 1826; Malay states under protection 1874–1914; Sarawak and North Borneo protectorates 1888. Malaya independent 1957, Malaysia formed 1963."],
  ["Singapore","GB",[[1819,1963,"f"]],"Founded as a Company trading post 1819; part of Malaysia 1963–65.",[1.35,103.82]],
  ["Brunei","GB",[[1888,1984,"f"]],"Protected state."],
  ["Hong Kong","GB",[[1841,1997,"f"]],"Island ceded 1842; New Territories leased 1898; returned to China 1997.",[22.32,114.17]],
  ["Yemen","GB",[[1839,1967,"p"]],"Aden and the Aden Protectorate in the south only; North Yemen was never British."],
  ["United Arab Emirates","GB",[[1820,1892,"p"],[1892,1971,"f"]],"Trucial States: treaty-based protection rather than annexation."],
  ["Kuwait","GB",[[1899,1961,"f"]],"Protected state."],
  ["Bahrain","GB",[[1880,1971,"f"]],"Protected state.",[26.07,50.55]],
  ["Qatar","GB",[[1916,1971,"f"]],"Protected state."],
  ["Oman","GB",[[1891,1971,"p"]],"Informal British paramountcy; never formally a protectorate."],
  ["Iraq","GB",[[1920,1932,"m"]],"League of Nations mandate."],
  ["Jordan","GB",[[1921,1946,"m"]],"Transjordan, part of the Palestine mandate."],
  ["Israel","GB",[[1920,1948,"m"]],"Mandatory Palestine (civil administration from 1920)."],
  ["Palestine","GB",[[1920,1948,"m"]],"Mandatory Palestine (civil administration from 1920)."],
  ["Egypt","GB",[[1882,1914,"p"],[1914,1922,"f"],[1922,1956,"p"]],"Occupied 1882; protectorate 1914–22; British troops and influence until 1956."],

  ["S. Sudan","GB",[[1899,1956,"m"]],"Part of the Anglo-Egyptian Sudan."],
  ["Cyprus","GB",[[1878,1960,"f"]],"Administered from 1878, annexed 1914, Crown colony 1925."],
  ["N. Cyprus","GB",[[1878,1960,"f"]],"Part of British Cyprus."],
  ["Malta","GB",[[1800,1964,"f"]],"",[35.9,14.45]],
  ["Sierra Leone","GB",[[1808,1896,"p"],[1896,1961,"f"]],"Freetown colony 1808; protectorate over the interior 1896."],
  ["Gambia","GB",[[1816,1894,"p"],[1894,1965,"f"]],""],
  ["Ghana","GB",[[1821,1902,"p"],[1902,1957,"f"]],"Gold Coast forts; colony 1874; Asante and the north annexed 1901–02; British Togoland joined 1956."],
  ["Nigeria","GB",[[1861,1900,"p"],[1900,1960,"f"]],"Lagos 1861; protectorates 1900; amalgamated 1914."],
  ["Kenya","GB",[[1888,1895,"p"],[1895,1963,"f"]],"Imperial British East Africa Company 1888; protectorate 1895; Kenya Colony 1920."],
  ["Uganda","GB",[[1894,1962,"f"]],"Protectorate."],
  ["Tanzania","GB",[[1890,1919,"p"],[1919,1961,"m"]],"Zanzibar a British protectorate from 1890; the mainland was German East Africa until 1916–19, then the British mandate of Tanganyika."],
  ["Somaliland","GB",[[1884,1960,"f"]],"British Somaliland; united with Italian Somalia in 1960."],
  ["Malawi","GB",[[1891,1964,"f"]],"Nyasaland."],
  ["Zambia","GB",[[1890,1964,"f"]],"Northern Rhodesia; British South Africa Company rule until 1924."],
  ["Zimbabwe","GB",[[1890,1923,"f"],[1923,1980,"d"]],"Southern Rhodesia: Company rule 1890–1923; self-governing settler colony 1923; unilateral declaration of independence by the white-minority government 1965; independence 1980."],
  ["Botswana","GB",[[1885,1966,"f"]],"Bechuanaland Protectorate."],
  ["Lesotho","GB",[[1868,1966,"f"]],"Basutoland."],
  ["eSwatini","GB",[[1903,1968,"f"]],"Swaziland."],
  ["Mauritius","GB",[[1810,1968,"f"]],"Taken from France 1810, ceded 1814.",[-20.25,57.55]],
  ["Seychelles","GB",[[1794,1976,"f"]],"",[-4.68,55.49]],
  ["Br. Indian Ocean Ter.","GB",[[1814,1965,"f"],[1965,NOW,"o"]],"Chagos Archipelago: administered from Mauritius until detached in 1965.",[-7.3,72.4]],
  ["Jamaica","GB",[[1655,1962,"f"]],"Taken from Spain 1655."],
  ["Trinidad and Tobago","GB",[[1797,1962,"f"]],""],
  ["Barbados","GB",[[1627,1966,"f"]],"",[13.17,-59.55]],
  ["Bahamas","GB",[[1718,1973,"f"]],""],
  ["Belize","GB",[[1798,1862,"p"],[1862,1981,"f"]],"British Honduras."],
  ["Guyana","GB",[[1796,1814,"p"],[1814,1966,"f"]],"British Guiana; formerly Dutch."],
  ["Antigua and Barb.","GB",[[1632,1981,"f"]],""],

<p class="kicker">PO5004 · Peace and Development · University of Limerick</p>
<h1>Empire and After</h1>
<p><em>A scrolling atlas of colonialism, from antiquity to the present, with a focus on the British and French empires, their end, and what they left behind.</em></p>
<p>The map behind this text changes as you scroll. The opening chapters are a brief overview. Most of the detail goes to Britain and France after 1750, to decolonisation, and to the ways colonial arrangements still shape development policy and practice.</p>
<div class="howto"><b>Reading the map.</b> Colours show which power ruled a place in the year shown at top right. Territory is drawn with <b>modern borders</b> as a stand-in for colonial units, so all shading is simplified. Figures with a dotted underline are ${ax("approximate or contested")}. Hover over or tap a country for dates. Full references and method notes are under the buttons at the top.</div>
<p class="scrollcue">Scroll to begin ↓</p>`},

/* ---------------- CHAPTER 1 ---------------- */
{ch:"c1", b:V.oldworld, yearLabel:"c. 100 CE", ancient:true,
 mk:[[46.5,6,"Roman Empire","big"],[30.5,51.5,"Parthia","big"],[41.5,71,"Kushan","big"],[31,110,"Han China","big"]],
 html:`<h2>The vocabulary of empire</h2><p class="dates">c. 100 CE</p>
<p>The words we use are older than Europe's overseas empires. The Latin <em>colonia</em>, from <em>colere</em>, 'to cultivate', meant a settlement of Roman citizens, often army veterans, planted on conquered land to hold it.</p>
<p>Around 100 CE Rome ruled the whole Mediterranean basin. At the other end of Eurasia the Han dynasty governed a population of comparable size, with the Parthian and Kushan states between them (${c("burbank2010","Burbank and Cooper 2010")}; ${c("scheidel2009","Scheidel 2009")}). These were land empires. They absorbed conquered peoples through tribute, law and, in Rome's case, a slow extension of citizenship.</p>
<p>For our purposes they matter less as precedents than as a reminder that empire was a normal political form for most of recorded history. The nation-state is the newcomer.</p>
<p class="note"><b>Map note.</b> ${AP} Borders for 100 CE come from Ourednik's open <em>historical-basemaps</em> dataset, which flags them as low precision. Ancient frontiers were zones, not lines.</p>`},

{ch:"c1", b:V.med, yearLabel:"c. 800–500 BCE",
 mk:[[33.27,35.2,"Tyre"],[36.85,10.33,"Carthage (trad. 814 BCE)"],[36.53,-6.29,"Gadir / Cádiz"],[37.07,15.29,"Syracuse (733 BCE)"],[43.3,5.37,"Massalia (c. 600 BCE)"],[41.01,28.98,"Byzantion (c. 660 BCE)"],[32.82,21.86,"Cyrene (c. 630 BCE)"],[30.9,30.59,"Naukratis"]],
 html:`<h2>Phoenician and Greek settlement</h2><p class="dates">c. 800–500 BCE</p>
<p>Earlier still, Phoenician cities such as Tyre founded trading settlements across the western Mediterranean, Carthage among them. Greek cities sent out <em>apoikiai</em>, literally 'homes away', from Sicily and southern France to the Black Sea (${c("boardman1999","Boardman 1999")}).</p>
<p>Many of these settlements became independent of their founders within a generation. That is the useful contrast. An ancient <em>apoikia</em> was usually a new political community. Modern colonialism, as defined in this module, rests on a lasting and unequal relationship: between a metropole and its colony, and between settlers and the people already living there (${c("mishra2025","Mishra 2025")}).</p>
<p class="note"><b>Map note.</b> ${AP} Foundation dates are those given by ancient tradition; archaeological dates are often later.</p>`},

{ch:"c2", b:V.atlantic, year:1530, show:["SP","PT"], tord:true,
 mk:[[35.89,-5.32,"Ceuta 1415"],[5.08,-1.35,"Elmina 1482"],[-34.36,18.47,"Cape of Good Hope 1488"],[11.25,75.78,"Calicut 1498"],[15.5,73.83,"Goa 1510"],[2.19,102.25,"Malacca 1511"],[27.06,56.46,"Hormuz 1515"],[19.0,-70.7,"Hispaniola 1492"]],
 html:`<h2>Portugal and Castile turn outward</h2><p class="dates">1415–1530</p>
<p>Modern European colonialism began on the Atlantic rim. Portugal seized Ceuta in North Africa in 1415, then worked south along the West African coast, building forts such as Elmina (1482) to trade in gold and, increasingly, in people.</p>
<p>Vasco da Gama reached Calicut in 1498. Within two decades Portugal held fortified ports at Goa, Malacca and Hormuz: an empire of sea lanes and strongpoints rather than territory (${c("subrahmanyam2012","Subrahmanyam 2012")}). Castile, which backed Columbus from 1492, turned west. The Treaty of Tordesillas (1494) split the non-European world between the two crowns along a line in the Atlantic. Nobody outside Iberia was consulted.</p>
<p class="note"><b>Map note.</b> ${AP} The Tordesillas line is drawn at about 46°37′W, the usual reconstruction; its exact longitude was never agreed. Shading marks modern states where Iberian rule had begun by 1530, not the area actually controlled.</p>`},

{ch:"c2", b:V.americas, year:1650, show:["SP","PT"], arcs:"slave",
 mk:[[19.43,-99.13,"Tenochtitlan 1521"],[-7.16,-78.5,"Cajamarca 1532"],[-19.59,-65.75,"Potosí 1545"],[-12.97,-38.5,"Salvador da Bahia"]],
 html:`<h2>Conquest and the Atlantic system</h2><p class="dates">1492–1650</p>
<p>In the Americas, conquest was fast and catastrophic. Tenochtitlan fell to Cortés and his Indigenous allies in 1521; the Inca state collapsed after Pizarro's seizure of Atahualpa at Cajamarca in 1532. Epidemic disease, war and forced labour caused a demographic collapse. One widely cited reconstruction puts deaths at ${ax("around 56 million by 1600")} (${c("koch2019","Koch et al. 2019")}).</p>
<p>Silver from Potosí paid for Spanish power in Europe. Portuguese Brazil, and later the Caribbean, were organised around sugar grown by enslaved Africans. Between the sixteenth and nineteenth centuries ${ax("about 12.5 million")} Africans were forced aboard slave ships, of whom ${ax("about 10.7 million")} survived the crossing (${c("eltis2010","Eltis and Richardson 2010")}). Britain and France would become two of the largest carriers.</p>
<p class="note"><b>Map note.</b> ${SIMP} Arrows are schematic and link major regions of embarkation and arrival; they do not show volumes. Estimates draw on the Trans-Atlantic Slave Trade Database (${c("slavevoyages","SlaveVoyages n.d.")}).</p>`},

{ch:"c2", b:V.world, year:1700, show:["SP","PT","NL","GB","FR"],
 mk:[[37.21,-76.78,"Jamestown 1607"],[46.81,-71.21,"Quebec 1608"],[-6.13,106.82,"Batavia 1619"],[13.1,-59.6,"Barbados 1627"],[-33.92,18.42,"Cape Town 1652"],[13.08,80.27,"Madras 1639"]],
 html:`<h2>Companies and newcomers</h2><p class="dates">1600–1700</p>
<p>After 1600 the Dutch, English and French joined in, usually through chartered companies rather than the state itself. The English East India Company (1600), the Dutch VOC (1602) and the French Compagnie des Indes orientales (1664) were private corporations licensed to trade, to wage war and to govern (${c("dalrymple2019","Dalrymple 2019")}).</p>
<p>England founded Jamestown in 1607 and France founded Quebec in 1608. Both turned Caribbean islands such as Barbados and Martinique into plantation colonies worked by enslaved Africans. By 1700 the foundations of the two empires that occupy the rest of this story were in place.</p>
<p class="note"><b>Map note.</b> ${SIMP} North American colonies are drawn as schematic outlines. Indian and African trading posts are dots. Much of what Europeans 'claimed' in 1700 they did not control.</p>`},

/* ---------------- CHAPTER 3 ---------------- */
{ch:"c3", b:V.nam_india, year:1763, yearFrom:1750, show:["GB","FR","OTH"],
 mk:[[46.81,-71.21,"Quebec 1759"],[23.8,88.25,"Plassey 1757"],[11.93,79.83,"Pondichéry"]],
 html:`<h2>A global war decides an empire</h2><p class="dates">1756–1765</p>
<p>The eighteenth century was dominated by Anglo-French rivalry, fought on several continents at once. The Seven Years' War (1756–63) was decisive. Britain took Quebec in 1759, and the Treaty of Paris (1763) handed New France east of the Mississippi to Britain; France had already passed western Louisiana to Spain.</p>
<p>In Bengal, the East India Company's victory at Plassey (1757), and its grant of the right to collect the province's revenue (the <em>diwani</em>) in 1765, turned a trading company into a territorial power (${c("marshall2005","Marshall 2005")}).</p>
<p>France kept its Caribbean sugar islands, which were then worth far more to it than Canada. Watch the French outlines in North America disappear as the year advances.</p>
<p class="note"><b>Map note.</b> ${SIMP} New France and Louisiana are schematic. British 'Canada' after 1763 was mostly Indigenous land that Britain claimed rather than governed, hence the dashed style.</p>`},

{ch:"c3", b:V.carib, year:1804, yearFrom:1789, show:["GB","FR","OTH"],
 hl:[{label:"Haiti: Saint-Domingue until 1804", col:"#e3a21a", names:["Haiti"]}],
 mk:[[19.76,-72.2,"Cap-Français (Cap-Haïtien)",null,"top"],[18.11,-77.3,"Jamaica",null,"left"],[13.1,-59.6,"Barbados",null,"right"]],
 html:`<h2>Sugar, slavery and the Haitian Revolution</h2><p class="dates">1789–1834</p>
<p>By the 1780s Saint-Domingue, the western third of Hispaniola, was the richest colony in the Americas. It produced a large share of the world's sugar and coffee with the labour of ${ax("roughly half a million")} enslaved people (${c("dubois2004","Dubois 2004")}).</p>
<p>The revolution that began in August 1791 forced France to abolish slavery in 1794. After Napoleon's attempt to restore it, the war ended with Haitian independence in 1804. In 1825 France demanded 150 million francs as the price of recognition, later cut to 90 million. Haiti was still paying off the debts this created well into the twentieth century (${c("porter2022","Porter et al. 2022")}).</p>
<p>Britain abolished its slave trade in 1807 and slavery itself in 1833. It paid £20 million in compensation to slave-owners. The enslaved received nothing (${c("draper2010","Draper 2010")}).</p>`},

{ch:"c3", b:V.ireland, year:1801, show:["GB"],
 mk:[[53.35,-6.26,"Dublin"],[54.6,-7.3,"Ulster plantation, from 1609"],[51.92,-8.17,"Midleton, Co. Cork"]],
 html:`<h2>Ireland: colonised and complicit</h2><p class="dates">1541–1922</p>
<p>Ireland sits uneasily in this story. It was ruled by the English Crown from the twelfth century, reconquered under the Tudors, planted with Protestant settlers in Ulster from 1609, and joined to Great Britain by the Act of Union in 1801. In many respects it was governed as a colony.</p>
<p>Yet Irish soldiers, officials and missionaries also served the empire in large numbers. Reginald Dyer, the officer who ordered troops to fire on the crowd at Amritsar in 1919, was schooled at Midleton in County Cork. His superior, Michael O'Dwyer, the Lieutenant-Governor of the Punjab, was from Tipperary (${c("mishra2025","Mishra 2025")}).</p>
<p>Historians still argue over whether 'colony' is the right word for Ireland (${c("howe2000","Howe 2000")}). The useful point for us is that a place can be colonised and complicit at the same time.</p>
<p class="note"><b>Map note.</b> Ireland has its own dashed style because its status is contested.</p>`},

{ch:"c3", b:V.sasia, year:1858, yearFrom:1757, show:["GB","FR","OTH"],
 mk:[[22.57,88.36,"Calcutta",null,"right"],[28.99,77.7,"Meerut, May 1857",null,"right"],[28.61,77.21,"Delhi",null,"bottom"],[31.62,74.88,"Amritsar",null,"left"]],
 html:`<h2>India: from Company to Crown</h2><p class="dates">1757–1858</p>
<p>Over the next century the East India Company conquered or subordinated most of South Asia. It did so partly through war and partly through treaties that left ${ax("some 560")} princely states under British 'paramountcy'.</p>
<p>The uprising of 1857, which began among the Company's own sepoys at Meerut, was put down with great brutality. Parliament then transferred India to the Crown in 1858.</p>
<p>Colonial India's economy was reorganised around land revenue and the export of raw materials. Nationalist economists such as Dadabhai Naoroji called this a 'drain' of wealth to Britain (${c("naoroji1901","Naoroji 1901")}). Mike Davis links the famines of the late nineteenth century as much to colonial policy as to drought (${c("davis2001","Davis 2001")}). Economic historians still dispute how to weigh those factors.</p>
<p class="note"><b>Map note.</b> ${AP} The princely states, roughly two-fifths of the land area, are not shown separately. Watch British control spread from Bengal as the year advances.</p>`},

{ch:"c3", b:V.maghreb, year:1912, yearFrom:1830, show:["GB","FR","OTH"],
 hl:[{label:"Algeria: French settler colony", col:"#e3a21a", names:["Algeria"]}],
 mk:[[36.75,3.06,"Algiers 1830",null,"top"],[36.8,10.18,"Tunis 1881",null,"right"],[34.03,-5.0,"Fez 1912",null,"left"]],
 html:`<h2>Algeria: France's settler colony</h2><p class="dates">1830–1912</p>
<p>France's second colonial empire began with the invasion of Algiers in 1830. Conquest of the interior took decades of brutal warfare against Abd el-Kader and others. From 1848 northern Algeria was organised as French <em>départements</em>, legally part of France, and European settlers took much of the best land.</p>
<p>Most Muslim Algerians, however, remained subjects rather than citizens. From 1881 they were governed under the <em>code de l'indigénat</em>, a regime of summary penalties that France later extended across much of its empire. Tunisia became a protectorate in 1881 and Morocco in 1912.</p>
<p>The Republic's 'civilising mission' thus sat alongside a legal colour line (${c("conklin1997","Conklin 1997")}).</p>`},

{ch:"c3", b:V.africa, year:1880, show:["GB","FR","OTH"],
 html:`<h2>Africa before the Scramble</h2><p class="dates">1880</p>
<p>In 1880 European rule in Africa was still confined mostly to coasts and river mouths. The main exceptions were French Algeria, and the British and Boer settler territories in the south.</p>
<p>Within thirty years almost the whole continent would be partitioned. Keep scrolling to watch it happen.</p>
<p class="note"><b>Map note.</b> Dashed areas are coastal footholds or claims. Grey marks other European powers.</p>`},

{ch:"c3", b:V.africa, year:1914, show:["GB","FR","OTH"],
 mk:[[9.88,32.07,"Fashoda 1898",null,"left"],[14.17,38.9,"Adwa 1896",null,"top"],[7.6,40.5,"Ethiopia: independent","big"],[6.5,-9.5,"Liberia: independent","big"]],
 html:`<h2>The Scramble for Africa</h2><p class="dates">1880–1914</p>
<p>Despite the popular image, the Berlin Conference of 1884–85 did not itself divide Africa. It set rules for claiming territory, notably 'effective occupation' of coasts, and recognised Leopold II's Congo Free State. The borders themselves were fixed in dozens of bilateral treaties drawn up in European capitals. Many follow rivers, lines of latitude or straight lines across land that the negotiators had never seen (${c("pakenham1991","Pakenham 1991")}; ${c("herbst2000","Herbst 2000")}).</p>
<p>Britain and France came close to war at Fashoda on the Nile in 1898, then settled their differences in the Entente Cordiale of 1904. By 1914 only Ethiopia, which had defeated Italy at Adwa in 1896, and Liberia remained independent.</p>
<p class="note"><b>Map note.</b> ${SIMP} Colonial units such as French West Africa are shown through the modern states that later emerged from them; the 1914 internal boundaries were different.</p>`},

{ch:"c3", b:V.seasia, year:1900, yearFrom:1820, show:["GB","FR","OTH"],
 mk:[[13.75,100.5,"Siam: independent buffer","big"],[1.29,103.85,"Singapore 1819"],[10.78,106.7,"Saigon 1859"],[16.8,96.15,"Rangoon"]],
 html:`<h2>Southeast Asia: advancing from both sides</h2><p class="dates">1819–1900</p>
<p>In Southeast Asia the two empires advanced from opposite directions. Britain annexed Burma in three wars between 1824 and 1885 and brought the Malay states under its control, with Singapore (1819) as the hub of its Asian trade. France took Cochinchina in the 1860s and by 1893 had assembled the Indochinese Union of Vietnam, Cambodia and Laos.</p>
<p>Siam (Thailand) survived as a buffer between them, though it gave up territory to both.</p>
<p>The colonial economies of the region were built on rice, tin and rubber, and on migrant labour from China and India. Furnivall called the result a 'plural society', in which communities met in the market but little else (${c("furnivall1948","Furnivall 1948")}). That legacy still shapes politics in Malaysia and Myanmar.</p>`},

{ch:"c3", b:V.world, year:1922, yearFrom:1900, show:["GB","FR"],
 html:`<h2>The high point, and the strain</h2><p class="dates">1919–1922</p>
<p>After the First World War the victors divided Germany's colonies and the Arab provinces of the Ottoman Empire as League of Nations mandates. Britain took Iraq, Palestine, Transjordan and most of Tanganyika. France took Syria and Lebanon, and most of Cameroon and Togo.</p>
<p>The British Empire reached its greatest extent around 1920–22. It covered ${ax("roughly a quarter")} of the world's land surface and ruled ${ax("about a fifth")} of its people. France's empire was the second largest.</p>
<p>Yet the moment of greatest size was also one of strain. 1919 brought the Amritsar massacre, revolution in Egypt and war in Ireland, which ended with the Irish Free State in 1922 (${c("darwin2009","Darwin 2009")}).</p>
<p class="note"><b>Map note.</b> ${AP} Paler shading marks self-governing dominions such as Canada and Australia, which were moving towards full sovereignty. Dotted outlines mark mandates.</p>`},

/* ---------------- CHAPTER 4 ---------------- */
{ch:"c4", b:V.world, year:1945, yearFrom:1938, show:["GB","FR"],
 mk:[[36.19,5.41,"Sétif, 8 May 1945",null,"bottom"],[-4.27,15.28,"Brazzaville 1944",null,"left"],[21.03,105.85,"Hanoi, Sept 1945",null,"top"],[1.29,103.85,"Singapore falls 1942",null,"bottom"],[47.3,-54.0,"Atlantic Charter 1941",null,"top"]],
 html:`<h2>War breaks the spell</h2><p class="dates">1939–1945</p>
<p>The Second World War broke the aura of European invincibility. Japan's conquest of Malaya, Singapore and Burma in 1941–42 was a humiliation from which British rule in Asia never recovered.</p>
<p>The Atlantic Charter of 1941 promised self-determination, though Churchill insisted it applied to Nazi-occupied Europe. Free France depended on its African territories, yet at Brazzaville in 1944 it ruled out self-government for them.</p>
<p>On 8 May 1945, as Europe celebrated victory, French forces met a nationalist demonstration at Sétif in Algeria with massacres whose scale is still disputed. In September Ho Chi Minh declared Vietnam independent (${c("thomas2014","Thomas 2014")}).</p>
<p class="note"><b>Contested figures.</b> Estimates of the dead at Sétif and Guelma range from ${ax("about 1,500 (French official) to 45,000 (Algerian official)","Contested estimate")}.</p>`},

{ch:"c4", b:V.sasia, year:1948, yearFrom:1946, show:["GB","FR"],
 hl:[{label:"India, independent 15 Aug 1947", col:"#e3a21a", names:["India"]},
     {label:"Pakistan, independent 14 Aug 1947 (East Pakistan is now Bangladesh)", col:"#3f8a5b", names:["Pakistan","Bangladesh"]}],
 mk:[[31.55,74.34,"Lahore",null,"left"],[31.62,74.88,"Amritsar",null,"right"],[34.08,74.8,"Kashmir",null,"top"],[23.81,90.41,"Dhaka (East Pakistan)",null,"right"]],
 html:`<h2>Independence and partition in South Asia</h2><p class="dates">1947–1948</p>
<p>Britain's largest colony became independent in August 1947, divided into India and Pakistan, whose eastern wing is now Bangladesh. The new border was drawn in about five weeks by Cyril Radcliffe, a lawyer who had never been to India, and was published only after independence.</p>
<p>Partition brought mass violence and one of the largest forced migrations in history. Estimates run from ${ax("several hundred thousand to two million deaths","Contested estimate")}, with ${ax("around 15 million")} people displaced (${c("khan2017","Khan 2017")}). Burma and Ceylon became independent in 1948.</p>
<p>That same year Britain gave up its mandate in Palestine. The war that followed created the State of Israel and displaced ${ax("some 700,000")} Palestinians, the Nakba.</p>`},

{ch:"c4", b:V.war, year:1954, yearFrom:1946, show:["GB","FR"], focus:["Vietnam","Malaysia","Kenya","Madagascar","Cameroon","Algeria"],
 mk:[[21.39,103.02,"Dien Bien Phu 1954"],[3.8,102.0,"Malayan Emergency 1948–60"],[-0.42,36.95,"Mau Mau war 1952–60"],[-19.0,47.5,"Madagascar 1947"],[4.5,11.0,"Cameroon (UPC) 1955–71"]],
 html:`<h2>Wars of decolonisation</h2><p class="dates">1946–1960</p>
<p>Where settlers, bases or valuable resources were at stake, both powers fought. France waged war in Indochina from 1946 until its defeat at Dien Bien Phu in 1954. It crushed the 1947 uprising in Madagascar at a cost of ${ax("tens of thousands of lives","Contested estimate")}, and from 1955 fought Cameroon's nationalist UPC.</p>
<p>Britain fought a long counter-insurgency in Malaya (1948–60). In Kenya it suppressed the Mau Mau rising with mass detention, torture and more than a thousand executions (${c("anderson2005","Anderson 2005")}; ${c("elkins2005","Elkins 2005")}). In 2013 the British government expressed regret and paid £19.9 million to 5,228 Kenyan survivors (${c("hague2013","Hague 2013")}).</p>
<p>These wars undercut the old contrast between a peaceful British 'transfer of power' and French intransigence. Both records are mixed (${c("thomas2014","Thomas 2014")}).</p>
<p class="note"><b>Map note.</b> Bold outlines mark the main colonial wars named here.</p>`},

{ch:"c4", b:V.wafrica, year:1958, yearFrom:1955, show:["GB","FR","OTH"],
 mk:[[30.6,32.3,"Suez Canal 1956"],[5.6,-0.19,"Accra 1957"],[9.64,-13.58,"Conakry 1958"]],
 html:`<h2>Suez, Ghana and Guinea's 'no'</h2><p class="dates">1956–1958</p>
<p>In 1956 Britain and France invaded Egypt over the nationalisation of the Suez Canal, in secret collusion with Israel. American financial pressure forced them out. The crisis exposed the limits of both powers.</p>
<p>A year later the Gold Coast, led by Kwame Nkrumah, became independent as Ghana, the first sub-Saharan colony to do so.</p>
<p>France tried another route. De Gaulle's 1958 referendum offered its African territories a choice: membership of a new French Community, or immediate independence without French aid. Only Guinea, led by Sékou Touré, voted no. France pulled out abruptly, taking equipment and records with it (${c("cooper2002","Cooper 2002")}).</p>`},

{ch:"c4", b:V.africa, year:1961, yearFrom:1959, show:["GB","FR","OTH"],
 hl:[{label:"Became independent in 1960 (17 states)", col:"#3f8a5b", names:["Cameroon","Togo","Madagascar","Benin","Niger","Burkina Faso","Côte d'Ivoire","Chad","Central African Rep.","Congo","Gabon","Senegal","Mali","Mauritania","Nigeria","Somalia","Somaliland","Dem. Rep. Congo"]}],
 mk:[[-33.93,18.42,"Cape Town: 'wind of change', Feb 1960",null,"right"]],
 html:`<h2>1960: the Year of Africa</h2><p class="dates">1960</p>
<p>In 1960 seventeen African states became independent. Fourteen were former French colonies or trust territories; the others were Nigeria, Somalia and the Belgian Congo. In Cape Town that February, Harold Macmillan told the South African parliament that a 'wind of change' was blowing through the continent.</p>
<p>In December the UN General Assembly adopted Resolution 1514, which declared that colonial rule denied fundamental human rights. Britain and France were among the nine states that abstained (${c("un1960","United Nations 1960")}; ${c("getachew2019","Getachew 2019")}).</p>
<p>Independence did not end French influence. Defence agreements, the CFA franc and personal networks between Paris and African presidents, later called <em>Françafrique</em>, carried on (${c("cooper2002","Cooper 2002")}).</p>`},

{ch:"c4", b:V.maghreb, year:1962, yearFrom:1954, show:["GB","FR","OTH"],
 hl:[{label:"Algeria, independent 5 July 1962", col:"#e3a21a", names:["Algeria"]}],
 mk:[[36.75,3.06,"Algiers",null,"top"]],
 html:`<h2>Algeria, 1954–1962</h2><p class="dates">1954–1962</p>
<p>Algeria was different because, in French law, it was France. The war that began on 1 November 1954 brought down the Fourth Republic and returned de Gaulle to power in 1958.</p>
<p>The French army used systematic torture and forcibly resettled much of the rural population. In Paris in October 1961, police killed Algerian demonstrators. The Évian Accords of March 1962 led to independence on 5 July.</p>
<p>Within months ${ax("some 800,000")} settlers left for France. So did tens of thousands of <em>harkis</em>, Algerians who had served with French forces; many of those who stayed behind were killed. The Algerian death toll remains contested. French historians generally cite figures in the hundreds of thousands, while the Algerian state cites 1.5 million (${c("evans2012","Evans 2012")}; ${c("shepard2006","Shepard 2006")}).</p>`},

{ch:"c4", b:V.world, year:1997, show:[],
 nodots:true,
 mk:[[14.6,47.6,"Aden, 1967","gb"],[25.3,51.5,"Gulf states, 1971","gb"],[-17.83,31.05,"Rhodesia: UDI 1965, Zimbabwe 1980","gb"],[22.32,114.17,"Hong Kong, 1997","gb"],[18.1,-77.3,"Jamaica, 1962","gb"],[12.2,-68.0,"Eastern Caribbean, 1966–83","gb"],[-17.7,178.0,"Fiji, 1970","gb"],
     [11.2,42.2,"Djibouti, 1977","fr"],[-11.7,43.3,"Comoros, 1975","fr"],[-17.74,168.32,"Vanuatu (Anglo-French), 1980","fr"]],
 html:`<h2>The long tail of empire</h2><p class="dates">1962–1997</p>
<p>Decolonisation ran on for decades. Britain left Aden in 1967 after an insurgency and withdrew from the Gulf in 1971. In Rhodesia the white-minority government declared independence unilaterally in 1965 rather than accept majority rule. That came only after a guerrilla war, with the independence of Zimbabwe in 1980.</p>
<p>Many Caribbean and Pacific colonies became independent between 1962 and 1983. France left Djibouti in 1977. In 1975 the Comoros became independent, but Mayotte voted separately to stay French.</p>
<p>The return of Hong Kong to China in 1997 is often treated as the symbolic end of the British Empire (${c("hyam2006","Hyam 2006")}).</p>`},

<p>Drag the slider to see British and French rule in any year. You can also add the other European empires. Hover over or tap a country for its dates.</p>

/* ---------------- CHAPTER 5 ---------------- */
{ch:"c5", b:V.world, year:2026, show:["GB","FR"],
 html:`<h2>Empire is not quite over</h2><p class="dates">Today</p>
<p>Britain still holds fourteen Overseas Territories. France governs five overseas departments and regions, several overseas collectivities and New Caledonia, which has a status of its own. Seventeen territories remain on the UN list of Non-Self-Governing Territories, twelve of them administered by Britain or France (${c("unnsgt","United Nations n.d.")}).</p>
<p>New Caledonia voted against independence in three referendums between 2018 and 2021; the pro-independence movement boycotted the last. Deadly unrest followed in 2024. The Bougival Accord of July 2025 proposed a 'State of New Caledonia' within France, but the process collapsed when the National Assembly rejected the constitutional bill in April 2026 (${c("maclellan2026","Maclellan 2026")}).</p>
<p class="note"><b>Map note.</b> Bold shading marks territories still governed by Britain or France. Most are too small to see at this scale; hover over the dots.</p>`},

{ch:"c5", b:V.indian, year:2026, show:["GB","FR"],
 mk:[[-7.32,72.42,"Diego Garcia"],[-20.16,57.5,"Port Louis, Mauritius"]],
 html:`<h2>Chagos: decolonisation unfinished</h2><p class="dates">1965–2026</p>
<p>The Chagos Archipelago shows how late the colonial story runs. In 1965, three years before Mauritian independence, Britain detached the islands to create the British Indian Ocean Territory. Between 1968 and 1973 it removed the Chagossian population to make way for a US military base on Diego Garcia.</p>
<p>In 2019 the International Court of Justice advised that the detachment was unlawful and that Britain should end its administration (${c("icj2019","ICJ 2019")}). A treaty transferring sovereignty to Mauritius while keeping the base was signed in May 2025. As of November 2026 it has not been ratified. A UN human rights committee has urged both governments not to proceed without securing Chagossians' own rights (${c("clegg2026","Clegg 2026")}; ${c("riotimes2026","The Rio Times 2026")}).</p>
<p class="note"><b>Current affairs.</b> Checked 19 November 2026. The position may have changed since.</p>`},

{ch:"c5", b:V.africa, year:2026, show:[], outline:AFRICA,
 html:`<h2>Lines on the map</h2><p class="dates">Borders since independence</p>
<p>Colonial borders proved remarkably durable. In 1964 the Organisation of African Unity resolved to respect the frontiers that existed at independence, fearing that redrawing them would invite endless war. Most have held (${c("herbst2000","Herbst 2000")}).</p>
<p>The cost fell on peoples split between states. Michalopoulos and Papaioannou find that ethnic homelands partitioned by colonial borders have seen more political violence and poorer development outcomes than those left whole (${c("michalopoulos2016","Michalopoulos and Papaioannou 2016")}).</p>
<p>Similar arguments are made about the Radcliffe line in South Asia and the mandate borders of the Middle East. Historians also warn against blaming every later conflict on lines drawn on a colonial map.</p>`},

{ch:"c5", b:V.wafrica, year:2026, show:[],
 sets:[{label:"West African CFA franc (XOF, 8 states)", col:"#2f5f9e", names:["Benin","Burkina Faso","Côte d'Ivoire","Guinea-Bissau","Mali","Niger","Senegal","Togo"]},
       {label:"Central African CFA franc (XAF, 6 states)", col:"#6f93c6", names:["Cameroon","Central African Rep.","Chad","Congo","Eq. Guinea","Gabon"]}],
 mk:[[11.59,43.15,"Djibouti: main remaining French base"]],
 html:`<h2>Money and soldiers in Francophone Africa</h2><p class="dates">1945–2026</p>
<p>The CFA franc, created in 1945, is still used by fourteen African states in two currency unions. Both currencies are pegged to the euro, with convertibility guaranteed by the French Treasury. A 2019 reform ended the requirement for West African reserves to be held in Paris and withdrew French representatives from the central bank's governing bodies. It kept the peg (${c("pigeaud2021","Pigeaud and Sylla 2021")}). ECOWAS now aims to launch a wider West African currency, the Eco, in 2027 (${c("cesi2026","CeSI 2026")}).</p>
<p>Military ties have unwound faster. Between 2022 and July 2025 French forces left Mali, Burkina Faso, Niger, Chad, Côte d'Ivoire and Senegal. Djibouti is now France's main permanent base on the continent (${c("aljazeera2025","Al Jazeera 2025")}).</p>
<p class="note"><b>Map note.</b> Guinea-Bissau and Equatorial Guinea use the CFA franc but were never French colonies.</p>`},

{ch:"c5", b:V.eafrica, year:2026, show:[], sets:[{label:"Former British East and Central Africa", col:"#b23a2e", names:["Kenya","Uganda","Tanzania","Malawi","Zambia","Zimbabwe"]}],
 mk:[[-0.3,36.4,"Former 'White Highlands'"]],
 html:`<h2>Land, law and indirect rule</h2><p class="dates">Former British Africa</p>
<p>Colonial rule reshaped land and authority in ways that outlived it. In Kenya, the best land in the central highlands was reserved for European settlers. After independence, land transfers often favoured the new elite, and land has remained a recurring source of conflict.</p>
<p>Mamdani argues that indirect rule through appointed 'customary' chiefs produced a 'bifurcated state': citizens under civil law in the towns, subjects under customary authority in the countryside (${c("mamdani1996","Mamdani 1996")}). Lange finds that British colonies ruled more directly have tended to develop better than those ruled indirectly (${c("lange2009","Lange 2009")}).</p>
<p>Economists have also traced present-day institutions to colonial origins (${c("ajr2001","Acemoglu, Johnson and Robinson 2001")}) and to inherited legal systems (${c("laporta2008","La Porta, Lopez-de-Silanes and Shleifer 2008")}). These findings are contested on both data and method (${c("albouy2012","Albouy 2012")}).</p>`},

{ch:"c5", b:V.sasia, year:2026, show:[], sets:[{label:"Former British India", col:"#b23a2e", names:["India","Pakistan","Bangladesh"]}],
 mk:[[34.08,74.8,"Kashmir"]],
 html:`<h2>The colonial state's long afterlife</h2><p class="dates">South Asia</p>
<p>In South Asia the legal architecture of the colonial state lasted most of a century beyond independence. The Indian Penal Code of 1860, drafted under Thomas Babington Macaulay, stayed in force in India until it was replaced by the Bharatiya Nyaya Sanhita in July 2024. Its section 377, which criminalised homosexuality, had already been struck down by the Supreme Court in 2018. Versions of it survive in other former British colonies, and Pakistan and Bangladesh still use descendants of the 1860 code.</p>
<p>Partition still shapes politics in all three states, most acutely over Kashmir. Debates over the economic balance sheet of the Raj, revived for a wide audience by Tharoor, echo the 'drain' arguments of the nineteenth century (${c("tharoor2017","Tharoor 2017")}).</p>`},

{ch:"c5", b:V.europe_africa, year:2026, show:[], arcs:"aid",
 mk:[[51.51,-0.13,"London"],[48.86,2.35,"Paris"]],
 html:`<h2>Development's colonial roots</h2><p class="dates">1929–today</p>
<p>Development itself has colonial roots. Britain's Colonial Development and Welfare Act of 1940 and France's FIDES fund of 1946 were attempts to give empire new legitimacy through investment in welfare and production (${c("cooper1996","Cooper 1996")}).</p>
<p>The institutions they created outlived empire. The Colonial Development Corporation (1948) is today British International Investment, and the Agence française de développement descends from a fund set up by Free France in 1941.</p>
<p>People carried over too. Kothari shows how former colonial officers became development consultants, bringing assumptions about expertise and 'native' capacity with them (${c("kothari2006","Kothari 2006")}). The first wave of NGO expansion in Africa coincided with decolonisation itself (${c("cullen2022","Cullen, McCorriston and Thompson 2022")}).</p>
<p class="note"><b>Map note.</b> ${SIMP} Lines are illustrative of continuing aid and investment ties, not measured flows.</p>`},

{ch:"c5", b:V.uk, year:2026, show:[],
 hl:[{label:"Britain", col:"#b23a2e", names:["United Kingdom"]}],
 mk:[[51.5,-0.12,"London: British Museum; Windrush at Tilbury, 1948",null,"bottom"],[51.45,-2.59,"Bristol: Colston statue toppled, 2020",null,"left"],[53.41,-2.99,"Liverpool",null,"left"]],
 html:`<h2>Empire at home: Britain</h2><p class="dates">1948–today</p>
<p>In Britain, empire shows up in the population, in institutions and in arguments over memory. The British Nationality Act 1948 confirmed the right of colonial and Commonwealth citizens to settle, and the arrival of the <em>Empire Windrush</em> that June has come to stand for post-war Caribbean migration. Later immigration law steadily narrowed that right. In the Windrush scandal of 2018, long-settled residents were wrongly detained or deported. An official review traced it to institutional ignorance about race and the history of empire (${c("williams2020","Williams 2020")}).</p>
<p>UCL's Legacies of British Slavery project traces how compensation money flowed into British property and finance (${c("lbs","UCL n.d.")}). Museums hold objects such as the Benin Bronzes, looted in 1897. Because the British Museum Act 1963 restricts disposals, Asante gold regalia returned to Kumasi in 2024 only on loan (${c("mishra2025","Mishra 2025")}).</p>`},

{ch:"c5", b:V.france, year:2026, show:[],
 hl:[{label:"France", col:"#2f5f9e", names:["France"]}],
 mk:[[48.86,2.35,"Paris",null,"top"],[43.3,5.37,"Marseille",null,"bottom"]],
 html:`<h2>Empire at home: France</h2><p class="dates">1962–today</p>
<p>In France, the debate about colonial legacies is bound up with questions of republican identity, citizenship and the <em>banlieues</em>, where many descendants of colonial migrants live. Official memory has moved slowly. Benjamin Stora's 2021 report on the Algerian war recommended acts of recognition rather than an apology (${c("stora2021","Stora 2021")}), and the state has since acknowledged responsibility for specific killings.</p>
<p>Restitution has moved further. After the Sarr–Savoy report (${c("sarr2018","Sarr and Savoy 2018")}), France returned 26 royal treasures to Benin in 2021. In May 2026 Parliament unanimously adopted a framework law allowing objects acquired illicitly between 1815 and 1972 to be returned by decree (${c("culture2026","Ministère de la Culture 2026")}).</p>
<p>On Haiti, President Macron acknowledged in 2025 that the 1825 indemnity was unjust and set up a joint commission of historians. Its recommendations are expected in December 2026 (${c("an2026","Assemblée nationale 2026")}).</p>`},

{ch:"c5", b:V.world, year:2026, show:[], ever:true,
 html:`<h2>Coloniality and knowledge</h2><p class="dates">An argument about the present</p>
<p>Decolonial scholars argue that the deepest legacy is epistemic. A 'coloniality of power' that ranks peoples and forms of knowledge has outlasted formal empire (${c("quijano2000","Quijano 2000")}; ${c("mignolo2007","Mignolo 2007")}; ${c("santos2018","Santos 2018")}).</p>
<p>For development research, this means asking whose knowledge counts, who sets the questions and who gets the credit. It also means recognising that tools such as the census and the household survey began as instruments of colonial government (${c("camfield2025","Camfield 2025")}; ${c("mishra2026","Mishra 2026")}).</p>
<p>Not everyone accepts this framing. A polemical 'case for colonialism' drew wide criticism (${c("gilley2018","Gilley 2018")}), but it shows that how empire should be judged remains contested rather than settled.</p>
<p class="note"><b>Map note.</b> Shaded: the <span id="ever-count">many</span> present-day states and territories that Britain, France or both ruled, in whole or in part, at some point since 1500.</p>`},

{ch:"c5", b:V.world, year:2026, show:[], ever:true, html:`<h2>Reading the map backwards</h2>
<p>This atlas has moved forward in time, but development practitioners usually meet the map the other way round: as a set of independent states with borders, currencies, legal codes, languages of government and aid relationships that were laid down under empire and then kept, adapted or contested.</p>
<p>The aim has not been to explain every outcome by colonial history. It has been to show how much of the terrain on which development policy operates was surveyed, divided and named by two European states, and how recently.</p>
<p class="note">Scroll on for notes on method, or open the <a href="#" onclick="openPanel('refs');return false">full reference list</a>.</p>`}
];

const METHOD = `
<p><b>What the colours mean.</b> Each modern state or territory is coloured by the power that ruled it in the year shown. This is a deliberate simplification. Colonial units rarely matched today's borders: French West Africa became eight states, British India became three, and many colonies were assembled or divided after they were first claimed. Using modern borders makes change over time easy to see and easy to compare with present-day development data, but it should not be read as a map of historical boundaries.</p>
<p><b>Line styles.</b> Solid fill: colony, protectorate or protected state. Dashed: partial control, such as coastal posts, company rule over part of a territory, contested claims, or informal domination. Dotted: League of Nations mandates, UN trust territories and condominiums. Pale fill: self-governing dominions and settler governments. Heavy outline: territory still governed by the same power today. Ireland has its own style because its colonial status is debated.</p>
<p><b>Dates.</b> Start and end dates follow common scholarly conventions (for example, the first formal annexation or protectorate treaty, and the date of independence). Many territories were acquired piece by piece, and effective control often lagged far behind legal claims, especially in the interiors of Africa, Australia and the Americas. Where a figure is approximate or contested, it carries a dotted underline in the text.</p>
<p><b>Sources for the map.</b> Modern boundaries are from Natural Earth (1:50m), via the <i>world-atlas</i> package. The borders for 100 CE are from Ourednik's <i>historical-basemaps</i>, which its author describes as a work in progress unsuitable for precise use; they are used here only for a broad overview. North American colonial outlines are schematic and were drawn for this page. Territory dates were compiled from the works in the reference list, chiefly Darwin (2009), Hyam (2006), Thomas (2014), Cooper (2002) and Burbank and Cooper (2010).</p>
<p><b>What is left out.</b> The United States, Russia, Japan and the Ottoman Empire also ruled colonies or conquered peoples in this period but are not mapped. Indigenous polities, which governed most of the territory Europeans 'claimed' until the late nineteenth century, cannot be shown with modern borders at all, and their absence from the colours should not be read as absence from history.</p>
<p><b>Currency of information.</b> Statements about the present (Chagos, New Caledonia, the CFA franc, French bases, restitution law and the Haiti commission) were checked on 19 November 2026.</p>
<p><b>Embedding in Google Sites.</b> Insert → Embed → Embed code, paste the whole of this file, then drag the embed box to full width and at least 700 px high. The map and data load from free public CDNs (jsDelivr, with unpkg and GitHub as fallbacks). No API key or account is needed.</p>`;

function loadScript(urls){
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return rej(new Error("script failed"));
      const s = document.createElement("script"); s.src = urls[i++];
      s.onload = res; s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
async function fetchJSON(urls){
  for (const u of urls){ try { const r = await fetch(u); if (r.ok) return await r.json(); } catch(e){} }
  throw new Error("data failed: " + urls[0]);
}
