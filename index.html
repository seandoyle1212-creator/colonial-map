function colourOf(e, show){
  if (show.includes(e)) return EMP[e].col;
  if (e === "GBFR" && (show.includes("GB") || show.includes("FR"))) return EMP.GBFR.col;
  if (OTHERS.includes(e) && show.includes("OTH")) return OTH_COL;
  return null;
}
function pick(entries, year, show){
  let best = null;
  for (const en of entries){
    const col = colourOf(en.e, show); if (!col) continue;
    for (const [a,b,s] of en.ph){
      if (year >= a && year < b){
        const r = RANK[s] + (en.e === "GB" || en.e === "FR" ? .1 : 0);
        if (!best || r > best.r) best = {e:en.e, s, col, r, note:en.note};
      }
    }
  }
  return best;
}
function darker(hex, k=.7){
  const n = parseInt(hex.slice(1),16); const r=(n>>16)*k|0, g=((n>>8)&255)*k|0, b=(n&255)*k|0;
  return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
const BASE = {fillColor:"#efe8d7", fillOpacity:1, color:"#bfb39b", weight:.5, dashArray:null, opacity:1};
function styleFrom(st){
  if (!st) return BASE;
  const S = STATUS[st.s];
  return {fillColor:st.col, fillOpacity:S.fo, color:darker(st.col,.62), weight:S.w, dashArray:S.d || null, opacity:1};
}
function fmtPh(ph){
  return ph.map(([a,b,s]) => `${a}–${b===NOW?"today":b}: ${STATUS[s].label.toLowerCase()}`).join("<br>");
}

let customDefs = [], dotDefsL = [];
let map, countryLayer, customLayer, dotLayer, overlay, ancientLayer = null, ancientData = null;
let curYear = null, curStop = null, activeIndex = -1, tween = null, everCount = 0;
const yearEl = document.getElementById("year"), yearNote = document.getElementById("yearnote"), legendEl = document.getElementById("legend");

function render(year, stop){
  const show = stop.show || [];
  const sets = stop.sets || [];
  const focus = new Set(stop.focus || []);
  const outline = new Set(stop.outline || []);
  countryLayer.eachLayer(l => {
    const n = l.feature.properties.name;
    let st;
    if (stop.ancient) st = null;
    else if (stop.ever) st = everState(n);
    else {
      const set = sets.find(x => x.names.includes(n));
      st = set ? {s:"f", col:set.col} : (byName[n] ? pick(byName[n], year, show) : null);
    }
    const hl = (stop.hl || []).find(x => x.names.includes(n));
    if (hl) st = {s:"f", col:hl.col};
    const sty = Object.assign({}, styleFrom(st));
    if (hl){ sty.fillOpacity = .85; sty.weight = 2; sty.color = "#1f1c18"; sty.dashArray = null; }
    if (stop.ancient) sty.fillColor = "#ece6d6";
    if (focus.has(n)){ sty.weight = 2.6; sty.color = "#1f1c18"; sty.dashArray = null; }
    if (outline.has(n)){ sty.weight = 1.4; sty.color = "#3b332a"; }
    l.setStyle(sty);
    l._st = st;
  });
  const plain = stop.ancient || stop.ever || sets.length;
  customDefs.forEach(l => {
    const st = plain ? null : pick([{e:l._def.e, ph:l._def.ph}], year, show);
    if (st){ l.setStyle(styleFrom(st)); if (!customLayer.hasLayer(l)) customLayer.addLayer(l); }
    else if (customLayer.hasLayer(l)) customLayer.removeLayer(l);
  });
  dotDefsL.forEach(l => {
    const st = (plain || stop.nodots) ? null : pick([{e:l._e, ph:l._ph}], year, show);
    if (st){ l.setStyle({radius: isPhone()?4:5, fillColor:st.col, color:"#fff", weight:1.2, fillOpacity:1, opacity:1}); if (!dotLayer.hasLayer(l)) dotLayer.addLayer(l); }
    else if (dotLayer.hasLayer(l)) dotLayer.removeLayer(l);
  });
  curYear = year;
  yearEl.textContent = stop.yearLabel || (year >= 2026 ? "Today" : year);
  yearNote.textContent = stop.yearLabel ? "" : (year >= 2026 ? "November 2026" : "");
}

let everMap = null;
function everState(n){
  if (!everMap){
    everMap = {};
    TERR.forEach(([name,e,ph]) => {
      if (!["GB","FR","GBFR"].includes(e)) return;
      if (ph.every(p => p[2] === "h")) return;
      const m = everMap[name] = everMap[name] || new Set();
      if (e === "GBFR"){ m.add("GB"); m.add("FR"); } else m.add(e);
    });
    // places ruled through outlines or trading posts rather than whole modern states
    Object.entries({"Canada":["FR"], "United States of America":["GB","FR"], "India":["FR"]})
      .forEach(([n,es]) => { const m = everMap[n] = everMap[n] || new Set(); es.forEach(x => m.add(x)); });
    everCount = Object.keys(everMap).length + DOTS.filter(d => d[1]==="GB"||d[1]==="FR").filter(d=>!everMap[d[0]]).length;
  }
  const m = everMap[n]; if (!m) return null;
  return {s:"f", col: m.size === 2 ? EMP.GBFR.col : EMP[[...m][0]].col};
}

function legend(stop){
  const show = stop.show || [];
  let h = "";
  (stop.hl || []).forEach(x => h += `<div class="row"><span class="sw" style="background:${x.col};opacity:.85;outline:1.5px solid #1f1c18;outline-offset:-1.5px"></span><b>${x.label}</b></div>`);
  if ((stop.mk || []).some(m => m[3] === "gb")) h += `<div class="row"><span class="dot" style="background:${EMP.GB.col}"></span>British withdrawal (hover for date)</div>`;
  if ((stop.mk || []).some(m => m[3] === "fr")) h += `<div class="row"><span class="dot" style="background:${EMP.FR.col}"></span>French withdrawal (hover for date)</div>`;
  if (stop.ancient){
    h += `<div class="row"><span class="sw" style="background:#8e3b72;opacity:.6"></span>Roman Empire</div>
          <div class="row"><span class="sw" style="background:#b8860b;opacity:.6"></span>Han China</div>
          <div class="row"><span class="sw" style="background:#5f7f3a;opacity:.6"></span>Parthia</div>
          <div class="row"><span class="sw" style="background:#4d7c8a;opacity:.6"></span>Kushan Empire</div>`;
  } else if (stop.ever){
    h += `<div class="hd">Ever ruled, in whole or part</div>
          <div class="row"><span class="sw" style="background:${EMP.GB.col};opacity:.62"></span>By Britain</div>
          <div class="row"><span class="sw" style="background:${EMP.FR.col};opacity:.62"></span>By France</div>
          <div class="row"><span class="sw" style="background:${EMP.GBFR.col};opacity:.62"></span>By both, at different times</div>`;
  } else if (stop.sets){
    stop.sets.forEach(s => h += `<div class="row"><span class="sw" style="background:${s.col};opacity:.62"></span>${s.label}</div>`);
  } else if (show.length){
    show.forEach(e => {
      const col = e === "OTH" ? OTH_COL : EMP[e].col;
      const name = e === "OTH" ? "Other European powers" : EMP[e].name;
      h += `<div class="row"><span class="sw" style="background:${col};opacity:.7"></span>${name}</div>`;
    });
    if (show.includes("GB") && show.includes("FR")) h += `<div class="row"><span class="sw" style="background:${EMP.GBFR.col};opacity:.5"></span>Anglo-French condominium</div>`;
    h += `<details class="status"><summary>Line styles ▸</summary>` + ["f","p","m","d","o"].concat(show.includes("GB") && (stop.year||2026) < 1922 && (stop.year||0) > 1540 ? ["u"] : []).map(k => {
      const S = STATUS[k];
      return `<div class="row"><svg class="sw" viewBox="0 0 22 12"><rect x="1" y="1" width="20" height="10" fill="#777" fill-opacity="${S.fo}" stroke="#333" stroke-width="${Math.min(S.w,1.8)}" ${S.d?`stroke-dasharray="${S.d}"`:""}/></svg>${S.label}</div>`;
    }).join("") + `</details>`;
  }
  legendEl.innerHTML = h;
}

function drawOverlay(stop){
  overlay.clearLayers();
  const OFF = {right:[6,0], left:[-6,0], top:[0,-6], bottom:[0,6]};
  (stop.mk || []).forEach(([lat,lng,t,cls,dir]) => {
    if (cls === "gb" || cls === "fr"){
      L.circleMarker([lat,lng], {radius:7, color:"#fff", weight:2, fillColor:EMP[cls.toUpperCase()].col, fillOpacity:1})
        .bindTooltip(t, {direction:"top", offset:[0,-8], className:"lbl"}).addTo(overlay);
    } else if (cls === "big"){
      L.tooltip({permanent:true, direction:"center", className:"lbl big", interactive:false}).setLatLng([lat,lng]).setContent(t).addTo(overlay);
    } else {
      L.circleMarker([lat,lng], {radius:3.5, color:"#1f1c18", weight:1.5, fillColor:"#fbf8f1", fillOpacity:1})
        .bindTooltip(t, {permanent:!isPhone(), direction:dir||"right", offset:OFF[dir||"right"], className:"lbl"}).addTo(overlay);
    }
  });
  if (stop.tord){
    L.polyline([[72,-46.62],[-58,-46.62]], {color:"#5b4636", weight:1.6, dashArray:"6 5"}).addTo(overlay)
     .bindTooltip("Tordesillas line, 1494 (approx.)", {permanent:true, direction:"right", className:"lbl", offset:[4,0]}).openTooltip([30,-46.62]);
  }
  if (stop.arcs === "slave"){
    const from = [[14.5,-16.8],[6.3,2.1],[4.4,7.2],[-8.8,13.2]];
    const to = [[-12.97,-38.5],[-22.9,-43.2],[18.1,-77.3],[19.6,-72.3],[13.1,-59.6],[32.8,-79.9],[-8.05,-34.9]];
    from.forEach(a => to.forEach(b => arc(a,b,"#6b3d24",.32)));
  }
  if (stop.arcs === "aid"){
    const lon = [51.51,-0.13], par = [48.86,2.35];
    [[-1.29,36.82],[9.06,7.49],[5.6,-0.19],[0.35,32.58],[8.48,-13.23]].forEach(b => arc(lon,b,EMP.GB.col,.55));
    [[14.69,-17.44],[12.64,-8.0],[5.35,-4.0],[3.87,11.52],[13.51,2.11],[12.1,15.04]].forEach(b => arc(par,b,EMP.FR.col,.55));
  }
  if (stop.ancient && ancientLayer) ancientLayer.addTo(overlay);
}
function arc(a,b,col,op){
  const pts = []; const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
  const dx = b[1]-a[1], dy = b[0]-a[0];
  const cx = mx + dx*.18, cy = my - dy*.18;
  for (let t=0; t<=1.001; t+=.05){
    pts.push([(1-t)*(1-t)*a[0] + 2*(1-t)*t*cx + t*t*b[0], (1-t)*(1-t)*a[1] + 2*(1-t)*t*cy + t*t*b[1]]);
  }
  L.polyline(pts, {color:col, weight:1.3, opacity:op, interactive:false}).addTo(overlay);
}

function goTo(stop){
  const pad = isPhone()
    ? {paddingTopLeft:[10,60], paddingBottomRight:[10, Math.round(innerHeight*.5)]}
    : {paddingTopLeft:[Math.min(innerWidth*.45, 500), 60], paddingBottomRight:[isPhoneLegend()?20:230, 30]};
  const opts = Object.assign({maxZoom: stop.maxZoom || 6}, pad);
  if (reduceMotion) map.fitBounds(stop.b, Object.assign(opts, {animate:false}));
  else map.flyToBounds(stop.b, Object.assign(opts, {duration:1.5}));
}
function isPhoneLegend(){ return innerWidth < 1100; }

function animateYear(stop){
  if (tween) cancelAnimationFrame(tween);
  const target = stop.year;
  if (stop.yearLabel || target == null){ render(target || 2026, stop); return; }
  const numericPrev = typeof curYear === "number" && curStop && !curStop.yearLabel && !curStop.ever && !curStop.sets;
  let start;
  if (stop.yearFrom != null && (!numericPrev || curYear >= target || target - curYear > 300)) start = stop.yearFrom;
  else if (numericPrev && Math.abs(curYear - target) <= 300) start = curYear;
  else start = target;
  if (reduceMotion || start === target){ render(target, stop); return; }
  const dur = Math.max(500, Math.min(2400, Math.abs(target - start) * 28));
  const t0 = performance.now(); let last = null;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const y = Math.round(start + (target - start) * (k<.5 ? 2*k*k : 1 - Math.pow(-2*k+2,2)/2));
    if (y !== last){ render(y, stop); last = y; }
    if (k < 1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}

function activate(i){
  if (i === activeIndex || !map) { activeIndex = i; return; }
  activeIndex = i;
  const stop = STOPS[i];
  document.querySelectorAll(".step").forEach(el => el.classList.toggle("is-active", +el.dataset.index === i));
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.ch === stop.ch ? "true" : "false"));
  goTo(stop);
  drawOverlay(stop);
  legend(stop);
  if (stop.explorer) setupExplorer(stop);
  animateYear(stop);
  curStop = stop;
  map.dragging[ stop.explorer && !isPhone() ? "enable" : "disable" ]();
  if (stop.ever){ const ec = document.getElementById("ever-count"); if (ec) ec.textContent = everCount; }
}

function setupExplorer(stop){
  const r = document.getElementById("ex-year"), play = document.getElementById("ex-play");
  const gb = document.getElementById("ex-gb"), fr = document.getElementById("ex-fr"), oth = document.getElementById("ex-oth");
  if (r._wired) { stop.year = +r.value; return; }
  r._wired = true;
  const upd = () => {
    stop.show = [gb.checked&&"GB", fr.checked&&"FR", oth.checked&&"OTH"].filter(Boolean);
    stop.year = +r.value;
    if (curStop === stop){ legend(stop); render(stop.year, stop); }
  };
  [gb,fr,oth].forEach(x => x.onchange = upd);
  r.oninput = upd;
  let playing = null;
  play.onclick = () => {
    if (playing){ cancelAnimationFrame(playing); playing = null; play.textContent = "▶ Play 1750–2026"; return; }
    if (+r.value >= 2026) r.value = 1750;
    play.textContent = "❚❚ Pause";
    let last = performance.now();
    const tick = now => {
      if (now - last > 45){ r.value = +r.value + 1; upd(); last = now; }
      if (+r.value < 2026 && curStop === stop) playing = requestAnimationFrame(tick);
      else { playing = null; play.textContent = "▶ Play 1750–2026"; }
    };
    playing = requestAnimationFrame(tick);
  };
}

async function initMap(){
  await loadScript(CDN.leaflet);
  await loadScript(CDN.topo);
  const topo = await fetchJSON(CDN.world);
  const geo = topojson.feature(topo, topo.objects.countries);
  // drop Antarctica; stop polygons that cross the 180° meridian (Fiji, Russia, Alaska) from smearing across the map
  geo.features = geo.features.filter(f => f.properties.name !== "Antarctica");
  const fixRing = r => { const lo = r.some(p => p[0] < -170), hi = r.some(p => p[0] > 170);
    return (lo && hi) ? r.map(p => [p[0] < 0 ? p[0] + 360 : p[0], p[1]]) : r; };
  geo.features.forEach(f => { const g = f.geometry; if (!g) return;
    if (g.type === "Polygon") g.coordinates = g.coordinates.map(fixRing);
    if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(poly => poly.map(fixRing)); });

  map = L.map("map", {
    zoomControl:false, scrollWheelZoom:false, doubleClickZoom:false, boxZoom:false, keyboard:false,
    touchZoom:false, dragging:false, zoomSnap:.25, minZoom:isPhone() ? 0 : 1, maxZoom:7, preferCanvas:true,
    worldCopyJump:false, attributionControl:true, inertia:false
  });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('Boundaries: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a> · 100 CE: <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">Ourednik</a>');
  map.fitBounds(V.world);

  countryLayer = L.geoJSON(geo, {
    style: () => BASE,
    onEachFeature: (f, l) => {
      l.bindTooltip(() => {
        const n = f.properties.name;
        const en = byName[n] || [];
        const showE = curStop ? (curStop.show || []) : [];
        const rel = en.filter(x => x.ph.some(p => p[2] !== "h"));
        let h = `<b>${n}</b>`;
        if (curStop && curStop.ancient) return h + "<br><i>Modern border shown for orientation</i>";
        if (rel.length){
          h += rel.map(x => `<br><span style="color:${EMP[x.e].col};font-weight:700">${EMP[x.e].name}</span><br>${fmtPh(x.ph)}${x.note?`<br><i>${x.note}</i>`:""}`).join("");
        } else if (en.length) {
          h += `<br>${en.map(x => EMP[x.e].name).join(", ")}: metropole${en[0].note?`<br><i>${en[0].note}</i>`:""}`;
        }
        return h + `<br><span style="color:#6a6157">Dates simplified; see "About the map".</span>`;
      }, {sticky:true, className:"tip", direction:"auto"});
    }
  }).addTo(map);

  customLayer = L.layerGroup().addTo(map);
  Object.values(CUSTOM).forEach(d => {
    const p = L.polygon(d.ll, {opacity:0, fillOpacity:0}).bindTooltip(`<b>${d.name}</b><br>${EMP[d.e].name}<br>${fmtPh(d.ph)}`, {sticky:true, className:"tip"});
    p._def = d; customDefs.push(p);
  });

  dotLayer = L.layerGroup().addTo(map);
  const dotDefs = DOTS.map(([n,e,ph,ll]) => ({n,e,ph,ll}));
  TERR.forEach(([n,e,ph,note,dot]) => { if (dot) dotDefs.push({n,e,ph,ll:dot,note}); });
  dotDefs.forEach(d => {
    const m = L.circleMarker(d.ll, {radius:5, opacity:0, fillOpacity:0})
      .bindTooltip(() => `<b>${d.n}</b><br>${EMP[d.e].name}<br>${fmtPh(d.ph)}${d.note?`<br><i>${d.note}</i>`:""}`, {className:"tip"});
    m._e = d.e; m._ph = d.ph; dotDefsL.push(m);
  });

  overlay = L.layerGroup().addTo(map);

  // ancient borders (optional; loaded in the background)
  fetchJSON(CDN.ancient).then(data => {
    const COL = {"Roman Empire":"#8e3b72","Han":"#b8860b","Parthian Empire":"#5f7f3a","Kushan Empire":"#4d7c8a"};
    // the dataset splits the Kushan Empire into two pieces; draw it as one merged outline instead
    data.features = data.features.filter(f => COL[f.properties.SUBJECTO] && f.properties.SUBJECTO !== "Kushan Empire");
    data.features.push({type:"Feature", properties:{NAME:"Kushan Empire", SUBJECTO:"Kushan Empire"}, geometry:{"type":"Polygon","coordinates":[[[59.3,25.34],[59.57,27.29],[62.79,34.6],[61.86,36.0],[63.09,40.06],[73.17,41.17],[75.93,39.06],[77.2,33.28],[75.51,33.61],[74.77,33.65],[74.14,32.61],[70.29,31.29],[67.39,28.23],[66.43,25.49],[65.77,25.31],[64.85,25.21],[64.24,25.21],[64.03,25.4],[63.65,25.34],[63.4,25.16],[62.45,25.16],[61.35,25.03],[60.86,25.1],[60.47,25.3],[59.3,25.34]]]}});
    ancientLayer = L.geoJSON(data, {style: f => ({fillColor:COL[f.properties.SUBJECTO], fillOpacity:.55, color:darker(COL[f.properties.SUBJECTO],.6), weight:.8}),
      interactive:false});
    if (curStop && curStop.ancient) ancientLayer.addTo(overlay);
  }).catch(() => console.warn("Ancient borders unavailable"));

  const first = activeIndex < 0 ? 0 : activeIndex; activeIndex = -1; activate(first);
}

// switch stops as each card crosses the middle of the screen
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) activate(+e.target.dataset.index); });
}, {rootMargin:"-45% 0px -45% 0px"});
document.querySelectorAll(".step").forEach(el => io.observe(el));
activeIndex = 0;
document.querySelector('.step[data-index="0"]').classList.add("is-active");

initMap().catch(err => { console.error(err); document.getElementById("maperr").style.display = "block"; document.querySelectorAll(".card").forEach(cd=>cd.style.opacity=1); });

addEventListener("resize", () => { if (map && curStop) { map.invalidateSize(); goTo(curStop); } });
</script>
