<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✏️ SWAP: the title shown in the browser tab -->

  <style>
    /* ------------------------------------------------------------
       COLOURS — change these to restyle the whole page.
       ------------------------------------------------------------ */
    :root {
      --card-bg: rgba(255, 252, 245, 0.95);  /* text box background (0.95 = almost solid) */
      --card-text: #1f1b16;                  /* text colour inside the boxes */
      --card-muted: #6b6257;                 /* small grey notes */
      --accent: #a23b2a;                     /* headings, highlighted territory */
      --context-line: #8a7f72;               /* thin lines for all other historical borders */
      --page-bg: #e9e4da;                    /* shows briefly while map tiles load */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --card-bg: rgba(28, 25, 22, 0.94);
        --card-text: #f1ece4;
        --card-muted: #b3a999;
        --accent: #e0826f;
        --context-line: #9c9184;
        --page-bg: #1c1916;
      }
    }

    html, body { margin: 0; padding: 0; background: var(--page-bg); }
    body { font-family: Georgia, "Times New Roman", serif; color: var(--card-text); }

    /* The map stays fixed in the background while the text scrolls over it. */
    #map { position: fixed; inset: 0; z-index: 0; }

    /* Fade the modern basemap so the historical outlines stand out
       and modern labels are less prominent. 0 = invisible, 1 = full strength. */
    .basemap { filter: grayscale(1) sepia(0.25); opacity: 0.55; }

    /* "Open full screen" bar — only appears when the page is embedded in Google Sites. */
    #topbar {
      position: fixed; top: 10px; right: 10px; z-index: 1000; display: none;
      font: 14px/1.2 system-ui, sans-serif;
    }
    #topbar a {
      display: inline-block; padding: 8px 12px; border-radius: 6px;
      background: var(--card-bg); color: var(--card-text); text-decoration: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    /* The column of text "stops" that scroll past the map. */
    #story { position: relative; z-index: 1; pointer-events: none; }
    .step {
      min-height: 100vh;              /* each stop takes one screen of scrolling */
      display: flex; align-items: center;
      padding: 0 16px; box-sizing: border-box;
    }
    .card {
      pointer-events: auto;
      width: 100%; max-width: 380px;
      margin-left: 3vw;
      background: var(--card-bg);
      padding: 20px 22px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      line-height: 1.55; font-size: 17px;
      opacity: 0.35; transition: opacity .4s;
    }
    .step.is-active .card { opacity: 1; }
    .card h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); line-height: 1.25; }
    .card .dates { margin: 0 0 12px; font: 600 13px/1.3 system-ui, sans-serif;
                   letter-spacing: .04em; text-transform: uppercase; color: var(--card-muted); }
    .card p { margin: 0 0 10px; }
    .card .note { font: 13px/1.45 system-ui, sans-serif; color: var(--card-muted);
                  border-top: 1px solid rgba(128,128,128,.3); padding-top: 8px; margin-top: 12px; }
    .spacer { height: 40vh; }

    /* Permanent text labels placed on the map (used for the Haiti stop). */
    .map-label {
      background: var(--card-bg); color: var(--card-text); border: 1px solid var(--accent);
      font: 600 13px/1.2 system-ui, sans-serif; box-shadow: none;
    }

    /* PHONES: text boxes sit along the bottom so the map is visible above them. */
    @media (max-width: 700px) {
      .step { align-items: flex-end; padding-bottom: 6vh; }
      .card { margin: 0 auto; max-width: none; font-size: 16px; padding: 16px 18px; }
    }

    /* Respect visitors who turn off animations in their device settings. */
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>

           <p>Formal rule had its own vocabulary: chartered companies with powers of war and government; protectorates that left a ruler nominally sovereign; indirect rule through local authorities; and, after 1919, League of Nations mandates.</p>`,

});
L.tileLayer(BASEMAP_URL, Object.assign({ className: "basemap" }, BASEMAP_OPTIONS)).addTo(map);
if (STOPS.some(s => s.year)) map.attributionControl.addAttribution(HISTORY_CREDIT);

// --- Build the text boxes from the STOPS list ---
const story = document.getElementById("story");
story.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');
STOPS.forEach((stop, i) => {
  const step = document.createElement("section");
  step.className = "step";
  step.dataset.index = i;
  step.innerHTML = `
    <div class="card">
      <h2>${stop.title}</h2>
      ${stop.dates ? `<p class="dates">${stop.dates}</p>` : ""}
      ${stop.text}
      ${stop.note ? `<p class="note">${stop.note}</p>` : ""}
    </div>`;
  story.appendChild(step);
});
story.insertAdjacentHTML("beforeend", '<div class="spacer"></div>');

// --- Historical borders: load each year's file once, then reuse it ---
const yearCache = {};
function loadYear(year) {
  if (!yearCache[year]) {
    yearCache[year] = fetch(HISTORY_URL.replace("{year}", year))
      .then(r => { if (!r.ok) throw new Error("No file for " + year); return r.json(); })
      .catch(err => { console.warn(err); return null; });
  }
  return yearCache[year];
}

let overlay = null;      // the borders currently drawn
let labelLayer = null;   // the pinned label currently drawn
let activeIndex = -1;

function drawOverlay(stop, index) {
  if (overlay) { map.removeLayer(overlay); overlay = null; }
  if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }

  if (stop.label) {
    labelLayer = L.tooltip({ permanent: true, direction: "center", className: "map-label" })
      .setLatLng([stop.label.lat, stop.label.lng])
      .setContent(stop.label.text)
      .addTo(map);
  }
  if (!stop.year) return;

  const names = stop.highlight || [];
  const rulers = stop.ruler || [];
  loadYear(stop.year).then(data => {
    if (!data || index !== activeIndex) return; // visitor already scrolled on
    overlay = L.geoJSON(data, {
      style: f => {
        const p = f.properties || {};
        const on = names.includes(p.NAME) || rulers.includes(p.SUBJECTO);
        return on
          ? { color: cssVar("--accent"), weight: 2, fillColor: cssVar("--accent"), fillOpacity: 0.35 }
          : { color: cssVar("--context-line"), weight: 0.6, fillOpacity: 0 };
      }
    }).addTo(map);
  });
}

// Move the map so the target sits in the open area beside (or above) the text box.
function goTo(stop) {
  const target = L.latLng(stop.lat, stop.lng);
  const z = stop.zoom;
  const card = document.querySelector(`.step[data-index="${STOPS.indexOf(stop)}"] .card`);
  let shift = L.point(0, 0);
  if (card) {
    const r = card.getBoundingClientRect();
    shift = isPhone() ? L.point(0, r.height / 2) : L.point(-(r.right) / 2, 0);
  }
  const center = map.unproject(map.project(target, z).add(shift), z);
  if (reduceMotion) map.setView(center, z, { animate: false });
  else map.flyTo(center, z, { duration: 1.6 });
}

function activate(index) {
  if (index === activeIndex) return;
  activeIndex = index;
  document.querySelectorAll(".step").forEach(el =>
    el.classList.toggle("is-active", Number(el.dataset.index) === index));
  goTo(STOPS[index]);
  drawOverlay(STOPS[index], index);
}

// Start on the first stop, then switch whenever a box crosses the middle of the screen.
map.setView([STOPS[0].lat, STOPS[0].lng], STOPS[0].zoom);
activate(0);
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) activate(Number(e.target.dataset.index)); });
}, { rootMargin: "-45% 0px -45% 0px" });
document.querySelectorAll(".step").forEach(el => observer.observe(el));

/* ---------------------------------------------------------------------
   NOTES ON HISTORICAL OUTLINES
   - Names must match the dataset exactly (capitals and spaces too).
     To see the names for a year, open this link in a browser and use
     Find (Ctrl/Cmd+F), replacing 1914 with your year:
     https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_1914.geojson
     Look for "NAME":"..." (the territory) and "SUBJECTO":"..." (who ruled it).
   - The dataset is a volunteer project. Its own documentation says to
     check it against other sources before academic use. Many borders
     are marked low-precision. Say so in your notes.
   - If a name doesn't match, nothing is coloured — the page won't break.
   --------------------------------------------------------------------- */
</script>
</body>
</html>
